<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TT Laden</title>
<meta name="theme-color" content="#D7262E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT Laden">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-karte" id="login-form" autocomplete="on">
    <img src="logo.png" alt="Tayfun Textilpflege" width="1355" height="325">
    <h1>Ladenbuch</h1>
    <label class="field" for="l-geraet">Name dieses Geräts<input id="l-geraet" value="iPad Laden" maxlength="60" autocomplete="off" required></label>
    <label class="field" for="l-pass">Laden-Passwort<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Anmelden</button>
    <p class="mini" id="l-info" role="status"></p>
  </form>
</div>
<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Bereiche">
    <div class="mark">TAYFUN<span>LADENBUCH</span></div>
    <button data-nav="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Heute</button>
    <button data-nav="annahme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Annahme</button>
    <button data-nav="auftraege"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v16l-5-3-5 3z"/></svg>Aufträge</button>
    <button data-nav="werkstatt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/></svg>Werkstatt</button>
    <button data-nav="teile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M18 15v6M15 18h6"/></svg>Teile</button>
    <button data-nav="kunden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Kunden</button>
    <button data-nav="kundendienst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v3M12 13.5v.5"/></svg>Kunden&shy;dienst</button>
    <button data-nav="kasse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Kasse</button>
    <button data-nav="management"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Leitung</button>
  </nav>
  <div class="main">
    <div class="update" id="update" hidden><span>Neue Version des Ladenbuchs verfügbar.</span><button id="update-los" type="button">Jetzt aktualisieren</button></div>
    <header class="top">
      <h1 id="title">Heute</h1>
      <div class="store" id="stores" role="group" aria-label="Geschäft"></div>
      <label class="bediener-feld"><span class="sr">Wer arbeitet gerade?</span><select id="bediener" hidden></select></label>
      <button class="sync" id="sync" type="button">Synchronisiert</button>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="druck" aria-hidden="true"></div>
<script src="qrcode.min.js"></script>
<script src="schein.js"></script>
<script src="app.js"></script>
</body>
</html>
