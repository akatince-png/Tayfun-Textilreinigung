<style>
/* Layout: Tablet-App – Leiste links (Tablet) bzw. unten (Handy), Arbeitsfläche rechts. Rot wie das Ladenschild, sonst ruhig. */
:root {
  --bg: #F6F4F3;
  --surface: #FFFFFF;
  --ink: #1F1B1B;
  --muted: #6B6363;
  --line: #E4DFDE;
  --red: #D7262E;
  --red-ink: #FFFFFF;
  --red-soft: #FBE7E8;
  --rail: #2A2626;
  --rail-ink: #F3EFEE;
  --ok: #1E8A4A; --ok-soft: #E2F3E8;
  --warn: #B26A00; --warn-soft: #FDF0DB;
  --info: #2F5FA8; --info-soft: #E5ECF8;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171414; --surface: #221E1E; --ink: #F2EEED; --muted: #A79E9D; --line: #3A3333;
  --red: #E5434A; --red-soft: #3D1F21; --rail: #0F0D0D; --rail-ink: #F3EFEE;
  --ok: #4CC27C; --ok-soft: #1B3326; --warn: #E7A33E; --warn-soft: #3A2C14; --info: #7EA6E8; --info-soft: #1C2A40;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171414; --surface: #221E1E; --ink: #F2EEED; --muted: #A79E9D; --line: #3A3333;
  --red: #E5434A; --red-soft: #3D1F21; --rail: #0F0D0D; --rail-ink: #F3EFEE;
  --ok: #4CC27C; --ok-soft: #1B3326; --warn: #E7A33E; --warn-soft: #3A2C14; --info: #7EA6E8; --info-soft: #1C2A40;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 96px 1fr; min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 14px 8px; position: sticky; top: 0; height: 100vh; padding-left: max(8px, env(safe-area-inset-left, 0px)); }
.mark { font-weight: 800; font-stretch: 125%; font-size: 15px; letter-spacing: .02em; text-align: center; padding: 6px 0 14px; color: var(--rail-ink); }
.mark span { display: block; font-size: 8.5px; font-weight: 500; letter-spacing: .14em; opacity: .75; }
.rail button { background: none; border: 0; color: inherit; opacity: .72; border-radius: 10px; padding: 10px 4px; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.rail button svg { width: 24px; height: 24px; }
.rail button[aria-current="page"] { opacity: 1; background: var(--red); color: var(--red-ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 22px; font-stretch: 112%; margin: 0; flex: 1 1 auto; }
.store { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.store button { border: 0; background: none; padding: 7px 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
.store button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); border: 0; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.sync.off { background: var(--warn-soft); color: var(--warn); }
.demo { background: var(--info-soft); color: var(--info); font-size: 13px; padding-block: 8px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.demo button { background: none; border: 0; color: inherit; text-decoration: underline; font-size: 13px; padding: 0; }
.view { padding-block: 20px 40px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; }

h2 { font-size: 18px; font-stretch: 108%; margin: 0 0 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi b { display: block; font-size: 28px; font-stretch: 105%; line-height: 1.1; }
.kpi small { color: var(--muted); font-size: 13px; }
.kpi.alert { border-color: var(--warn); }
.kpi.alert b { color: var(--warn); }

.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; background: var(--red); color: var(--red-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.list { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); align-items: center; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row .t { font-weight: 700; min-width: 0; }
.row .s { color: var(--muted); font-size: 14px; grid-column: 1; }
.row .r { grid-row: 1 / span 2; grid-column: 2; text-align: right; display: grid; gap: 4px; justify-items: end; }
.empty { color: var(--muted); padding: 12px 4px; }

.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.p-arbeit { background: var(--info-soft); color: var(--info); }
.p-bereit { background: var(--ok-soft); color: var(--ok); }
.p-abgeholt { background: var(--line); color: var(--muted); }
.p-alt { background: var(--warn-soft); color: var(--warn); }
.p-kd { background: var(--red-soft); color: var(--red); }
.p-storno { background: var(--line); color: var(--muted); text-decoration: line-through; }
.chip .cnt { font-size: 12px; opacity: .65; margin-left: 4px; }
.scanbox { display: grid; gap: 10px; border: 2px solid var(--ink); border-radius: var(--r); padding: 14px 16px; background: var(--surface); }
.scanbox .scanrow { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 10px; }
@media (max-width: 560px) { .scanbox .scanrow { grid-template-columns: 1fr; } }
.scanbox input { font-size: 20px; font-weight: 700; letter-spacing: .04em; width: 100%; min-width: 0; }
.scanbox .field { min-width: 0; }
.scanlog { display: grid; gap: 4px; font-size: 14px; }
.scanlog .ok { color: var(--ok); } .scanlog .err { color: var(--red); }
.st { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--info-soft); color: var(--info); }
.st-fertig { background: var(--ok-soft); color: var(--ok); } .st-kundendienst { background: var(--red-soft); color: var(--red); }
.st-extern { background: var(--warn-soft); color: var(--warn); } .st-ausgegeben, .st-storniert { background: var(--line); color: var(--muted); }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--bg); }
.tbl td.l, .tbl th.l { text-align: left !important; }
.lock { max-width: 380px; margin: 40px auto; text-align: center; display: grid; gap: 12px; }
.lock input { text-align: center; font-size: 26px; letter-spacing: .4em; }
.mini { color: var(--muted); font-size: 13px; }
.digi { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.digi-grid { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 12px; align-items: center; }
@media (max-width: 560px) { .digi-grid { grid-template-columns: 1fr; justify-items: start; } }
.qr { background: #fff; padding: 10px; border-radius: 8px; width: 196px; height: 196px; }
.qr img, .qr canvas { display: block; }
.wa-btn { background: #1F8F4E; color: #fff; text-decoration: none; }
.kd { border: 1px solid var(--red); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--red-soft); }
.kd ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.kd .row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap: 10px; }
@media (max-width: 560px) { .kd .row2 { grid-template-columns: 1fr; } }
.storno-ask { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; color: var(--red); }
.p-stamm { background: var(--red-soft); color: var(--red); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

/* Annahme */
.annahme { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .annahme { grid-template-columns: 1fr; } }
.cats { margin-bottom: 12px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; text-align: left; display: grid; gap: 4px; min-height: 76px; align-content: space-between; }
.item b { font-size: 15px; line-height: 1.2; }
.item span { color: var(--muted); font-size: 14px; }
.item .offer { color: var(--red); font-weight: 700; }
.item:active { transform: scale(.98); }
.bon { position: sticky; top: 90px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 400; }
.lines { display: grid; gap: 2px; }
.line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.qty button { border: 0; background: none; width: 32px; height: 32px; font-size: 18px; font-weight: 700; }
.qty span { min-width: 22px; text-align: center; font-weight: 700; }
.line .n { min-width: 0; }
.line .n small { display: block; color: var(--red); font-weight: 600; }
.total { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; padding-top: 6px; }
.hint { font-size: 13px; color: var(--muted); }
.suggest { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.suggest button { border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 10px 12px; text-align: left; }
.suggest button:last-child { border-bottom: 0; }
.suggest button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.suggest small { color: var(--muted); font-size: 12px; grid-column: 1; }
.suggest .aehnlich { grid-column: 2; grid-row: 1 / span 2; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }
.suggest.lang { max-height: 340px; overflow-y: auto; }
.suggest .gr { background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.cust-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }

/* Auswertung */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: stretch; height: 180px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; padding-top: 18px; }
.bar i { display: block; width: 100%; max-width: 46px; background: var(--red); border-radius: 6px 6px 0 0; min-height: 2px; }
.bar.today i { background: var(--ink); }
.bar em { position: absolute; top: 0; font-style: normal; font-size: 12px; color: var(--muted); }
.barlabels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 12px; color: var(--muted); padding-top: 6px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) 2fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 5px 0; }
.hbar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { background: var(--bg); border-radius: 6px; height: 12px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--red); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tbl td:not(:first-child), .tbl th:not(:first-child) { text-align: right; }
.scroll { overflow-x: auto; }

.detail { display: grid; gap: 12px; min-width: 0; }
.pay .row2 { min-width: 0; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.pay { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.pay.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.pay .row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.pay-warn { color: var(--warn); font-size: 13px; font-weight: 600; }
/* Abholschein: 80-mm-Bondruck, bewusst schwarz auf weiß in beiden Themen */
.schein-img { width: 300px; max-width: 100%; height: auto; display: block; }
.kunde-ansicht { border: 0; border-radius: 16px; padding: 24px; max-width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: #fff; color: #111; }
.kunde-ansicht::backdrop { background: rgba(0,0,0,.6); }
.kunde-ansicht[open] { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 300px); gap: 24px; align-items: start; }
.ka-qr { display: grid; gap: 10px; justify-items: center; text-align: center; font-size: 15px; }
.ka-qr b { font-size: 20px; }
.ka-code canvas, .ka-code img { display: block; width: 300px; max-width: 100%; height: auto; }
.ka-code { padding: 12px; background: #fff; }
.ka-schein { width: 100%; height: auto; max-height: calc(100vh - 80px); object-fit: contain; }
@media (max-width: 700px) { .kunde-ansicht[open] { grid-template-columns: 1fr; overflow: auto; } }
.receipt-wrap { display: grid; gap: 8px; justify-items: center; }
.receipt { width: 300px; max-width: 100%; background: #fff; color: #111; font-family: "Courier New", ui-monospace, monospace; font-size: 13px; line-height: 1.35; padding: 18px 16px 22px; box-shadow: 0 6px 24px rgba(0,0,0,.18); position: relative; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fff 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fff 0) 0 0 / 12px 8px; }
.receipt .c { text-align: center; }
.receipt .brand { font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 125%; font-size: 20px; letter-spacing: .02em; }
.receipt .brand small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .3em; }
.receipt hr { border: 0; border-top: 1px dashed #111; margin: 10px 0; }
.receipt .nr { font-family: "Archivo", sans-serif; font-size: 34px; font-weight: 800; letter-spacing: .02em; margin: 2px 0; }
.receipt .rl { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
.receipt .rl small { display: block; font-size: 11px; }
.receipt .sum { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.receipt .stamp { border: 2px solid #111; text-align: center; font-weight: 700; padding: 4px; margin-top: 8px; letter-spacing: .1em; }
.receipt svg { display: block; margin: 6px auto 0; width: 100%; height: 54px; }
.receipt .rq { display: flex; justify-content: center; margin: 6px 0; } .receipt .rq img, .receipt .rq canvas { display: block; }
.pickbox { display: grid; gap: 8px; border: 2px solid var(--ok); border-radius: var(--r); padding: 12px 16px; background: var(--surface); }
.pickbox input { font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.receipt .tiny { font-size: 10.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 320px; }
.tag { background: #fff; color: #111; font-family: "Courier New", monospace; font-size: 11px; font-weight: 700; border: 1px solid #bbb; border-radius: 4px; padding: 4px 6px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
.detail dt { color: var(--muted); font-size: 14px; }
.detail dd { margin: 0; font-weight: 600; }

@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; justify-content: space-around; z-index: 10; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .mark { display: none; }
  .rail button { flex: 1; font-size: 10px; padding: 6px 0; min-width: 0; } .rail button svg { width: 20px; height: 20px; }
  .view { padding-bottom: 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .top, .demo { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .bon { position: static; }
}
@media (prefers-reduced-motion: reduce) { .item:active { transform: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/*SCHEIN*/
// Abholschein als Bild – dieselbe Zeichnung im Ladenbuch und auf beleg.html der Website.
// Die Daten stehen im Link hinter dem # und gehen nie an den Server.
const SCHEIN = (() => {
  const BASIS = "https://www.tayfun-textilpflege.de/beleg.html#";
  const C39 = { "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
    A:"wnnnnwnnw",B:"nnwnnwnnw",C:"wnwnnwnnn",D:"nnnnwwnnw",E:"wnnnwwnnn",F:"nnwnwwnnn",G:"nnnnnwwnw",H:"wnnnnwwnn",I:"nnwnnwwnn",J:"nnnnwwwnn",
    K:"wnnnnnnww",L:"nnwnnnnww",M:"wnwnnnnwn",N:"nnnnwnnww",O:"wnnnwnnwn",P:"nnwnwnnwn",Q:"nnnnnnwww",R:"wnnnnnwwn",S:"nnwnnnwwn",T:"nnnnwnwwn",
    U:"wwnnnnnnw",V:"nwwnnnnnw",W:"wwwnnnnnn",X:"nwnnwnnnw",Y:"wwnnwnnnn",Z:"nwwnwnnnn","-":"nwnnnnwnw","*":"nwnnwnwnn" };

  // d = { v, n: Auftrag, c: Prüfzeichen, k: Vorname, a: angenommen, f: abholbereit ab, t: Teile,
  //       p: [[Menge, Name, Cent, Hinweis]], s: Summe in Cent, b: Kassenbeleg-Nr. oder "", z: Zahlart }
  function packen(d) {
    let s = ""; new TextEncoder().encode(JSON.stringify(d)).forEach((b) => (s += String.fromCharCode(b)));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function auspacken(t) {
    const s = atob(t.replace(/-/g, "+").replace(/_/g, "/"));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(s, (ch) => ch.charCodeAt(0))));
    if (!d || d.v !== 1 || !/^[A-Z]-\d+$/.test(d.n) || !Array.isArray(d.p)) throw new Error("kein Abholschein");
    return d;
  }
  const link = (d) => BASIS + packen(d);
  const code = (d) => `${d.n}-${d.c}`;
  const euro = (c) => (c / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

  function qr(text, size) {
    const box = document.createElement("div");
    new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.L });
    // Kopie, weil qrcodejs seine eigene Canvas später ausblendet
    const c = document.createElement("canvas"); c.width = c.height = size; c.getContext("2d").drawImage(box.querySelector("canvas"), 0, 0); return c;
  }

  // Zeichnet den Schein in doppelter Auflösung; logo = geladenes <img> oder null
  // Zwei Durchgänge: erst die Länge ausmessen, dann in genau dieser Länge zeichnen
  function zeichnen(d, logo) { return malen(d, logo, malen(d, logo, 4000).height); }
  function malen(d, logo, H) {
    const W = 600, R = 40, X = R + 36, IW = W - 72, MONO = 'ui-monospace, Menlo, "Courier New", monospace', SANS = 'Archivo, "Arial Black", "Helvetica Neue", Arial, sans-serif';
    const cv = document.createElement("canvas"); cv.width = W + 2 * R; cv.height = H;
    const g = cv.getContext("2d");
    g.fillStyle = "#e9e6e1"; g.fillRect(0, 0, cv.width, H);
    // Papier mit gezacktem Abriss oben und unten
    const z = 12, top = 24, bot = H - 24;
    g.save(); g.shadowColor = "rgba(0,0,0,.18)"; g.shadowBlur = 18; g.shadowOffsetY = 4; g.fillStyle = "#fffefa";
    g.beginPath(); g.moveTo(R, top);
    for (let x = R; x < R + W; x += z) { g.lineTo(x + z / 2, top - 8); g.lineTo(x + z, top); }
    g.lineTo(R + W, bot);
    for (let x = R + W; x > R; x -= z) { g.lineTo(x - z / 2, bot + 8); g.lineTo(x - z, bot); }
    g.closePath(); g.fill(); g.restore();

    let y = top + 30;
    const txt = (t, x, f, al = "left", c = "#151515") => { g.font = f; g.fillStyle = c; g.textAlign = al; g.fillText(t, x, y); };
    const mitte = (t, f, c) => txt(t, W / 2 + R, f, "center", c);
    const strich = () => { y += 18; g.save(); g.strokeStyle = "#555"; g.setLineDash([8, 7]); g.lineWidth = 2; g.beginPath(); g.moveTo(X, y); g.lineTo(X + IW, y); g.stroke(); g.restore(); y += 28; };
    const kuerzen = (t, f, max) => { g.font = f; if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };

    if (logo) { const lh = IW * logo.naturalHeight / logo.naturalWidth; g.drawImage(logo, X, y, IW, lh); y += lh + 34; }
    else { y += 40; mitte("TAYFUN", `800 54px ${SANS}`, "#d7262f"); y += 34; mitte("T E X T I L P F L E G E", `600 22px ${SANS}`, "#d7262f"); y += 34; }
    mitte("An der Kirche 10 · 30457 Hannover", `22px ${MONO}`); y += 28;
    mitte("Tel. + WhatsApp 0511 464252", `22px ${MONO}`); strich();

    y += 8; mitte("A B H O L S C H E I N", `700 26px ${MONO}`); y += 72;
    mitte(d.n, `800 76px ${SANS}`); y += 22;
    const q = qr("TAYFUN " + code(d), 220); g.drawImage(q, W / 2 + R - 110, y, 220, 220); y += 220 + 40;
    mitte("Abholcode: " + code(d), `700 26px ${MONO}`); strich();

    const info = [[d.k ? "Kunde:" : "", d.k || ""], ["Angenommen:", d.a], ["Abholbereit ab:", d.f, 1], ["Teile:", String(d.t)]].filter((r) => r[0]);
    info.forEach(([a, b, fett]) => { txt(a, X, `${fett ? "700 " : ""}24px ${MONO}`); txt(b, X + IW, `${fett ? "700 " : ""}24px ${MONO}`, "right"); y += 34; });
    y -= 34; strich();

    d.p.forEach(([m, name, cent, hinweis]) => {
      const f = `24px ${MONO}`; const preis = euro(cent);
      g.font = f; const pw = g.measureText(preis).width;
      txt(kuerzen(`${m} ${name}`, f, IW - pw - 20), X, f); txt(preis, X + IW, f, "right"); y += 34;
      if (hinweis) { txt("  * " + hinweis, X, `20px ${MONO}`, "left", "#555"); y += 34; }
    });
    y -= 34; strich();
    y += 6; txt("SUMME", X, `800 34px ${SANS}`); txt(euro(d.s), X + IW, `800 34px ${SANS}`, "right"); y += 26;
    g.lineWidth = 3; g.strokeStyle = "#151515"; g.strokeRect(X, y, IW, 58);
    y += 39; mitte(d.b ? `BEZAHLT · ${d.z || ""} · Beleg ${d.b}`.replace(" ·  ·", " ·") : "ZAHLBAR BEI ABHOLUNG", `700 24px ${MONO}`); y += 19; strich();

    mitte("Mo, Di, Do, Fr  8–13 + 15–18 Uhr", `21px ${MONO}`); y += 30;
    mitte("Mi + Sa  8–13 Uhr", `21px ${MONO}`); y += 30;
    mitte("Bitte bei der Abholung vorzeigen.", `21px ${MONO}`); y += 30;
    mitte("Dies ist kein Kassenbeleg.", `21px ${MONO}`, "#555"); y += 26;

    // Strichcode (Code 39) mit dem Abholcode
    const bars = []; let bx = 0;
    for (const ch of "*" + code(d) + "*") { [...C39[ch]].forEach((k, i) => { const w = k === "w" ? 3 : 1; if (i % 2 === 0) bars.push([bx, w]); bx += w; }); bx += 1; }
    const s = Math.min(3, IW / bx), bw = bx * s, x0 = W / 2 + R - bw / 2;
    g.fillStyle = "#151515"; bars.forEach(([x, w]) => g.fillRect(x0 + x * s, y, w * s, 80));
    y += 80 + 30; mitte(code(d), `22px ${MONO}`);
    if (H === 4000) return { height: y + 60 };
    return cv;
  }

  // Als PNG-Datei; Name ohne Sonderzeichen
  const datei = (cv, d) => new Promise((ok) => cv.toBlob((b) => ok(new File([b], `Abholschein-${d.n}.png`, { type: "image/png" })), "image/png"));

  return { BASIS, packen, auspacken, link, code, zeichnen, datei, qr };
})();

  const ITEM = Object.fromEntries(ITEMS.map((i) => [i.id, i]));

  // Angebote aus dem Schaufenster – werden beim Erfassen automatisch gerechnet
  function unitPrice(id, weekday, lines) {
    if (weekday === 2 && id === "hose") return [895, "Dienstagsangebot"];
    if (weekday === 2 && id === "hemd") {
      const n = lines.filter((l) => l.id === "hemd").reduce((s, l) => s + l.qty, 0);
      if (n >= 10) return [249, "Dienstags ab 10 Hemden"];
    }
    if (weekday === 5 && id === "anzug") return [1990, "Freitagsangebot"];
    return [ITEM[id].price, ""];
  }
  const total = (o) => o.lines.reduce((s, l) => s + l.qty * unitPrice(l.id, D(o.date).getDay(), o.lines)[0], 0);

  // ---------------------------------------------------------------- Hilfen

  const daysSince = (s) => Math.round((today0() - new Date(s + "T00:00")) / DAY);

    const customers = names.map((n, i) => ({ id: "K" + (1001 + i), name: n, tel: "0511 " + (400000 + Math.floor(rnd() * 99999)), store: i % 4 === 3 ? "F2" : "W", demo: true }));
    const orders = []; const t0 = today0();
    const baskets = [[["hemd", 5]], [["hemd", 12]], [["hose", 2]], [["anzug", 1]], [["anzug", 1], ["hemd", 3]], [["mantel", 1]], [["kleid", 1], ["bluse", 2]],
      [["bettdecke", 1], ["kissen", 2]], [["gardine", 14]], [["hose", 1], ["jacke", 1], ["krawatte", 1]], [["daunenjacke", 1]], [["lederjacke", 1]], [["wolldecke", 2]]];
    let seq = { W: 2400, F2: 800 };
    for (let d = 20; d >= 0; d--) {
      const date = new Date(t0.getTime() - d * DAY);
      if (date.getDay() === 0) continue;
      const n = 2 + Math.floor(rnd() * 4);
      for (let k = 0; k < n; k++) {
        const c = pick(customers); const store = rnd() < 0.7 ? "W" : "F2";
        const lines = pick(baskets).map(([id, qty]) => ({ id, qty }));
        const due = addWorkdays(date, 3);
        let status = "arbeit";
        if (due <= t0) status = rnd() < 0.75 || d > 16 ? "abgeholt" : "bereit";
        if (d >= 15 && status === "bereit") status = "bereit";
        orders.push({ nr: (store === "W" ? "W-" : "F-") + (++seq[store]), cust: c.id, store, date: iso(date), due: iso(due), status, lines, picked: status === "abgeholt" ? iso(addWorkdays(due, Math.floor(rnd() * 3))) : null });
      }
    }
    let beleg = 5120;
    orders.forEach((o) => { if (o.status === "abgeholt" || (o.status === "bereit" && rnd() < 0.3)) o.paid = { beleg: String(++beleg), art: rnd() < 0.6 ? "Karte" : "Bar", am: o.picked || o.due }; });
    const offeneA = orders.filter((o) => o.status === "arbeit");
    if (offeneA[2]) { offeneA[2].status = "kundendienst"; offeneA[2].kd = [{ am: offeneA[2].date, grund: "Fleck nicht entfernt", notiz: "Rotweinfleck, zweite Behandlung" }]; }
    const abg = orders.filter((o) => o.status === "abgeholt");
    if (abg[3]) { abg[3].status = "kundendienst"; abg[3].kd = [{ am: abg[3].picked || abg[3].due, grund: "Schaden am Teil", notiz: "Knopf beschädigt, Kunde informiert" }, { am: iso(new Date(t0.getTime() - 2 * DAY)), grund: "Beim Gutachter", notiz: "Sakko an Gutachter geschickt" }]; }
    if (offeneA[5]) { offeneA[5].status = "storniert"; offeneA[5].storniertAm = offeneA[5].date; }
    // zwei liegen lange abholbereit
    orders.filter((o) => o.status === "abgeholt" && daysSince(o.due) > 15).slice(0, 2).forEach((o) => { o.status = "bereit"; o.picked = null; });
    orders.forEach((o) => { if (rnd() < 0.18 && o.status !== "kundendienst") o.cust = "LAUF"; });
    // Teile anlegen und passend zum Auftragsstand verteilen
    const tseq = { W: 104000, F: 204000 }; let regal = 0;
    orders.forEach((o) => {
      o.items = [];
      o.lines.forEach((l) => { const n = ITEM[l.id].unit === "Stk" ? l.qty : 1; for (let i = 0; i < n; i++) o.items.push({ tnr: o.store + String(++tseq[o.store]), id: l.id, st: "angenommen", platz: "", log: [{ am: o.date, st: "angenommen" }] }); });
      const step = (it, st, am, platz) => { it.st = st; if (platz) it.platz = platz; it.log.push({ am, st, platz: it.platz }); };
      const age = daysSince(o.date);
      o.items.forEach((it, k) => {

        if (age >= 1) step(it, "reinigung", iso(new Date(D(o.date).getTime() + DAY)));
        if (o.status === "arbeit") { if (age >= 2 && rnd() < 0.6) step(it, ITEM[it.id].cat === "Leder" ? "extern" : "finish", iso(new Date(D(o.date).getTime() + 2 * DAY))); return; }

    orders.forEach((o) => (o.code = genCode()));

  }

  // Code 39 Strichcode für die Auftragsnummer (Scanner können ihn ohne Zusatzsoftware lesen)
  function tags(o) {

  // Abholcode = Auftragsnummer + 4 Prüfzeichen; nur wer den Schein (Papier oder Handy) hat, kennt die Prüfzeichen

  // Bild teilen: auf dem iPad öffnet sich „Teilen“ (WhatsApp, AirDrop, Nachrichten …); sonst als Datei speichern

  // ---------------------------------------------------------------- Kundensuche, verzeiht Tippfehler und Sonderzeichen
  const norm = (s) => s.toLowerCase().replace(/ı/g, "i").replace(/ß/g, "ss").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u").replace(/ph/g, "f").replace(/(.)\1/g, "$1").replace(/[^a-z0-9 ]/g, "");
  function dist(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }
  function findCustomers(q) {
    const digits = q.replace(/\D/g, ""); const nq = norm(q); const out = [];
    db.customers.forEach((c) => {
      if (digits.length >= 3 && c.tel.replace(/\D/g, "").includes(digits)) return out.push({ c, score: 0 });
      if (!nq) return;
      const words = norm(c.name).split(" ").filter(Boolean); const full = words.join(" ");
      if (full.includes(nq)) return out.push({ c, score: words.some((w) => w.startsWith(nq)) ? 0 : 1 });
      if (nq.length >= 3) {
        const tol = nq.length >= 6 ? 2 : 1;
        const best = Math.min(...words.map((w) => Math.min(dist(nq, w), dist(nq, w.slice(0, nq.length)))));
        if (best <= tol) out.push({ c, score: 2 + best, fuzzy: true });
      }
    });
    return out.sort((a, b) => a.score - b.score || a.c.name.localeCompare(b.c.name, "de")).slice(0, 8);
  }

  // ---------------------------------------------------------------- Ansichten
  const VIEWS = {
    heute() {
      const t = iso(today0()); const os = db.orders.filter(inStore);
      const neu = os.filter((o) => o.date === t);
      const faellig = os.filter((o) => o.status === "arbeit" && o.due <= t);
      const bereit = os.filter((o) => o.status === "bereit").sort((a, b) => a.due.localeCompare(b.due));
      const alt = bereit.filter((o) => daysSince(o.due) > 14);
      return `<div class="pickbox"><b>Abholung: Abholschein scannen</b>
          <label class="field" for="pick">QR-Code vom Papier oder vom Handy des Kunden scannen, oder Abholcode eintippen und Enter<input id="pick" placeholder="z. B. W-2401-K7P3" autocomplete="off" autocapitalize="characters"></label></div>
        <div class="kpis">
        <div class="kpi"><b class="num">${neu.length}</b><small>Annahmen heute</small></div>
        <div class="kpi"><b class="num">${euro(neu.reduce((s, o) => s + total(o), 0))}</b><small>Auftragswert heute</small></div>
        <div class="kpi"><b class="num">${bereit.length}</b><small>Abholbereit</small></div>
        <div class="kpi ${alt.length ? "alert" : ""}"><b class="num">${alt.length}</b><small>Länger als 14 Tage nicht abgeholt</small></div></div>
        <div><button class="btn" data-nav="annahme" type="button">+ Neue Annahme</button></div>
        <div class="grid2">
          <div class="panel"><h2>Heute fertig werden</h2>${list(faellig, "Nichts fällig – alles im Plan.")}</div>
          <div class="panel"><h2>Wartet auf Abholung</h2>${list(bereit.slice(0, 8), "Keine Aufträge abholbereit.")}</div>
          ${os.some((o) => o.status === "kundendienst") ? `<div class="panel"><h2>Beim Kundendienst</h2>${list(os.filter((o) => o.status === "kundendienst"), "")}</div>` : ""}
        </div>${ui.openOrder ? orderDetail(db.orders.find((o) => o.nr === ui.openOrder)) : ""}`;
    },

    annahme() {
      const d = ui.draft; const wd = D(d.date).getDay();
      const c = d.cust && cust(d.cust);
      const q = d.custQ.trim();
      const hits = q && !c ? findCustomers(q) : [];
      const last = (id) => db.orders.filter((o) => o.cust === id).map((o) => o.date).sort().pop();
      const item = (h, ae) => `<button data-cust="${h.id}" type="button"><span>${esc(h.name)}</span>${ae ? `<span class="aehnlich">ähnlich</span>` : ""}<small class="num">${h.tel}${last(h.id) ? " · zuletzt " + fmtDate(last(h.id)) : ""}</small></button>`;
      const recent = !q && !c && ui.showList ? [...db.customers].sort((a, b) => (last(b.id) || "").localeCompare(last(a.id) || "")).slice(0, 5) : [];
      let listHtml = "";
      if (!q && !c && ui.showList) {
        const alle = [...db.customers].sort((a, b) => a.name.localeCompare(b.name, "de"));
        let cur = ""; const parts = [`<div class="gr">Zuletzt da</div>`, ...recent.map((h) => item(h))];
        alle.forEach((h) => { const L = h.name[0].toUpperCase(); if (L !== cur) { cur = L; parts.push(`<div class="gr">${L}</div>`); } parts.push(item(h)); });
        listHtml = `<div class="suggest lang">${parts.join("")}</div>`;
      }
      const tiles = ITEMS.filter((i) => i.cat === ui.cat).map((i) => {
        const [p, why] = unitPrice(i.id, wd, d.lines.concat(i.id === "hemd" ? [{ id: "hemd", qty: 99 }] : []));
        const offer = why && !(i.id === "hemd") ? `<span class="offer num">${euro(p)} · ${why}</span>` : `<span class="num">${euro(i.price)}${i.unit !== "Stk" ? " / " + i.unit : ""}</span>`;
        return `<button class="item" data-add="${i.id}" type="button"><b>${esc(i.name)}</b>${offer}</button>`;
      }).join("");
      const sum = d.lines.reduce((s, l) => s + l.qty * unitPrice(l.id, wd, d.lines)[0], 0);
      const lines = d.lines.map((l, k) => { const [p, why] = unitPrice(l.id, wd, d.lines); return `<div class="line"><span class="qty"><button data-dec="${k}" type="button" aria-label="weniger">−</button><span class="num">${l.qty}</span><button data-inc="${k}" type="button" aria-label="mehr">+</button></span><span class="n">${esc(ITEM[l.id].name)}${why ? `<small>${why}</small>` : ""}</span><b class="num">${euro(p * l.qty)}</b></div>`; }).join("");
      const tag = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"][wd];
      return `<div class="annahme">
        <div class="panel"><div class="chips cats">${CATS.map((k) => `<button class="chip" data-cat="${k}" aria-pressed="${k === ui.cat}" type="button">${k}</button>`).join("")}</div>
          <div class="items">${tiles}</div>
          <p class="hint" style="margin-top:12px">Angebote rechnet die App selbst: dienstags Hose 8,95 € und ab 10 Hemden je 2,49 €, freitags Anzug 19,90 €.</p></div>
        <div class="panel bon">
          ${c ? `<div class="field">Kunde<div class="chips"><span class="chip" aria-pressed="true">${esc(c.name)}</span><button class="btn ghost small" data-uncust type="button">Ändern</button></div></div>`
              : `<label class="field" for="cust-q">Kunde (Name oder Telefon)<input id="cust-q" value="${esc(d.custQ)}" autocomplete="off" placeholder="Name, Teil vom Namen oder Telefon"></label>
                 <div class="cust-tools"><button class="btn ghost small" data-cust="LAUF" type="button">Ohne Namen (Laufkunde)</button><button class="btn ghost small" data-togglelist type="button">${ui.showList ? "Kundenliste schließen" : "Aus Kundenliste wählen"}</button><span class="hint">Tippfehler sind kein Problem, ähnliche Namen werden gefunden.</span></div>
                 ${listHtml}
                 ${hits.length ? `<div class="suggest lang">${hits.map((h) => item(h.c, h.fuzzy)).join("")}</div>` : ""}
                 ${q && !hits.length ? `<div class="cust-tools"><label class="field" for="new-tel" style="flex:1">Handynummer (für WhatsApp, freiwillig)<input id="new-tel" type="tel" inputmode="tel" placeholder="z. B. 0170 1234567" autocomplete="off"></label><button class="btn ghost small" data-newcust type="button">„${esc(d.custQ)}“ als neuen Kunden anlegen</button></div>` : ""}`}
          <div class="grid2" style="gap:10px;grid-template-columns:1fr 1fr">
            <label class="field" for="d-date">Annahmetag (${tag})<input type="date" id="d-date" value="${d.date}"></label>
            <label class="field" for="d-due">Abholbar ab<input type="date" id="d-due" value="${d.due}"></label></div>
          <div class="lines">${lines || `<p class="empty">Teile links antippen.</p>`}</div>
          <div class="total"><span>Summe</span><span class="num">${euro(sum)}</span></div>
          <button class="btn" data-save type="button" ${c && d.lines.length ? "" : "disabled"}>Auftrag speichern</button>
          <p class="hint">${c ? "" : "Erst Kunde wählen. "}Gespeichert wird sofort auf dem Tablet – auch ohne Internet.</p>
        </div></div>`;
    },

    auftraege() {
      const f = ui.filter; const t = iso(today0());
      let os = db.orders.filter(inStore);
      const offen = (o) => o.status !== "abgeholt" && o.status !== "storniert";
      const passt = (o, k) => k === "alle" ? true : k === "offen" ? offen(o) : k === "nichtbereit" ? o.status === "arbeit" || o.status === "kundendienst" : o.status === k;
      const aq = norm(ui.aq || "");
      if (aq) os = os.filter((o) => norm(o.nr).includes(aq) || norm(cust(o.cust).name).includes(aq));
      const alle = os;
      os = os.filter((o) => passt(o, f));
      os.sort((a, b) => b.date.localeCompare(a.date) || b.nr.localeCompare(a.nr));
      const F = [["offen", "Offen"], ["arbeit", "In Arbeit"], ["nichtbereit", "Nicht abholbereit"], ["bereit", "Abholbereit"], ["kundendienst", "Kundendienst"], ["abgeholt", "Abgeholt"], ["storniert", "Storniert"], ["alle", "Alle"]];
      return `<label for="aq" class="field">Auftrag suchen<input class="search" id="aq" value="${esc(ui.aq || "")}" placeholder="Auftragsnummer oder Kundenname" autocomplete="off"></label>
        <div class="chips">${F.map(([k, n]) => `<button class="chip" data-filter="${k}" aria-pressed="${k === f}" type="button">${n}<span class="cnt">${alle.filter((o) => passt(o, k)).length}</span></button>`).join("")}</div>
        ${ui.openOrder ? orderDetail(db.orders.find((o) => o.nr === ui.openOrder)) : ""}
        <div class="panel">${list(os.slice(0, 60), "Keine Aufträge in dieser Auswahl.")}</div>`;
    },

    kunden() {
      const q = ui.q.trim().toLowerCase();
      const stats = db.customers.map((c) => { const os = db.orders.filter((o) => o.cust === c.id && inStore(o) && zaehlt(o)); return { c, n: os.length, sum: os.reduce((s, o) => s + total(o), 0), last: os.map((o) => o.date).sort().pop() }; })
        .filter((x) => x.n && (!q || x.c.name.toLowerCase().includes(q) || x.c.tel.includes(q))).sort((a, b) => b.sum - a.sum);
      const open = ui.openCust && stats.find((x) => x.c.id === ui.openCust);
      return `<label for="kq" class="field">Suchen<input class="search" id="kq" value="${esc(ui.q)}" placeholder="Name oder Telefon" autocomplete="off"></label>
        ${open ? `<div class="panel detail"><h2>${esc(open.c.name)}</h2><dl><dt>Telefon</dt><dd class="num">${open.c.tel}</dd><dt>Kundennummer</dt><dd>${open.c.id}</dd><dt>Aufträge</dt><dd>${open.n}</dd><dt>Umsatz</dt><dd class="num">${euro(open.sum)}</dd></dl>
          ${list(db.orders.filter((o) => o.cust === open.c.id && inStore(o)).sort((a, b) => b.date.localeCompare(a.date)), "")}<div><button class="btn ghost" data-closecust type="button">Schließen</button></div></div>` : ""}
        <div class="panel"><div class="list">${stats.map((x) => `<button class="row" data-custopen="${x.c.id}" type="button"><span class="t">${esc(x.c.name)} ${x.n >= 5 ? `<span class="pill p-stamm">Stammkunde</span>` : ""}</span><span class="s num">${x.n} Aufträge · zuletzt ${fmtDate(x.last)}</span><span class="r"><b class="num">${euro(x.sum)}</b></span></button>`).join("") || `<p class="empty">Kein Kunde gefunden.</p>`}</div></div>`;
    },

    teile() {
      const items = allItems().filter(({ o }) => inStore(o));
      const tq = norm(ui.tq || "");
      const flt = ui.tfilter || "imhaus";
      const passt = ({ it }, k) => k === "alle" ? true : k === "imhaus" ? !["ausgegeben", "storniert"].includes(it.st) : it.st === k;
      let rows = items;
      if (tq) rows = rows.filter(({ it, o }) => norm(it.tnr).includes(tq) || norm(o.nr).includes(tq) || norm(cust(o.cust).name).includes(tq) || norm(ITEM[it.id].name).includes(tq));
      const basis = rows; rows = rows.filter((r) => passt(r, flt));
      rows.sort((a, b) => b.it.tnr.localeCompare(a.it.tnr));
      const F = [["imhaus", "Im Haus"], ...STATIONEN.filter(([k]) => k !== "storniert"), ["alle", "Alle"]];
      const ziel = ui.scanZiel || "reinigung";
      const offenTeil = ui.openTeil && allItems().find(({ it }) => it.tnr === ui.openTeil);
      const detail = offenTeil ? (() => { const { it, o } = offenTeil;
        return `<div class="panel detail"><h2>Teil ${it.tnr}</h2>
          <dl><dt>Artikel</dt><dd>${esc(ITEM[it.id].name)}</dd><dt>Auftrag</dt><dd><button class="btn ghost small" data-order="${o.nr}" data-goauftrag type="button">${o.nr}</button></dd>
          <dt>Kunde</dt><dd>${esc(cust(o.cust).name)}</dd><dt>Station</dt><dd>${stPill(it.st)}${it.platz ? " · " + esc(it.platz) : ""}</dd></dl>
          <h3 style="margin:6px 0 0;font-size:16px">Verlauf</h3><ol class="scanlog">${it.log.map((l) => `<li>${fmtDate(l.am)} · ${ST[l.st]}${l.platz && l.st === "fertig" ? " (" + esc(l.platz) + ")" : ""}</li>`).join("")}</ol>
          <div class="chips">${STATIONEN.filter(([k]) => !["storniert", "ausgegeben"].includes(k)).map(([k, n]) => `<button class="chip" data-tset="${k}" aria-pressed="${k === it.st}" type="button">${n}</button>`).join("")}</div>
          <div><button class="btn ghost small" data-tclose type="button">Schließen</button></div></div>`; })() : "";
      return `<div class="scanbox">
          <b>Teile scannen</b>
          <div class="chips">${STATIONEN.filter(([k]) => !["storniert", "angenommen"].includes(k)).map(([k, n]) => `<button class="chip" data-ziel="${k}" aria-pressed="${k === ziel}" type="button">${n}</button>`).join("")}</div>
          <div class="scanrow"><label class="field" for="scan">Etikett scannen oder Teilenummer eintippen, dann Enter<input id="scan" placeholder="z. B. W104523" autocomplete="off" autocapitalize="characters"></label>
          ${ziel === "fertig" ? `<label class="field" for="scan-platz">Platz im Regal<input id="scan-platz" value="${esc(ui.scanPlatz || "Stange 1")}" autocomplete="off"></label>` : `<span></span>`}</div>
          <span class="mini">Gescannte Teile wandern nach „${ST[ziel]}“. Sind alle Teile eines Auftrags fertig, wird der Auftrag automatisch abholbereit.</span>
          ${(ui.scans || []).length ? `<div class="scanlog">${ui.scans.slice(0, 6).map((s) => `<span class="${s.ok ? "ok" : "err"}">${s.ok ? "✓" : "✗"} ${esc(s.text)}</span>`).join("")}</div>` : ""}
        </div>
        ${detail}
        <label for="tq" class="field">Teil suchen<input class="search" id="tq" value="${esc(ui.tq || "")}" placeholder="Teilenummer, Auftrag, Kunde oder Artikel" autocomplete="off"></label>
        <div class="chips">${F.map(([k, n]) => `<button class="chip" data-tfilter="${k}" aria-pressed="${k === flt}" type="button">${n}<span class="cnt">${basis.filter((r) => passt(r, k)).length}</span></button>`).join("")}</div>
        <div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th class="l">Teil-Nr.</th><th class="l">Artikel</th><th class="l">Auftrag</th><th class="l">Kunde</th><th>Station</th><th>Platz</th><th>seit</th></tr></thead><tbody>
        ${rows.slice(0, 80).map(({ it, o }) => `<tr class="click" data-teil="${it.tnr}"><td class="l num"><b>${it.tnr}</b></td><td class="l">${esc(ITEM[it.id].name)}</td><td class="l num">${o.nr}</td><td class="l">${esc(cust(o.cust).name)}</td><td>${stPill(it.st)}</td><td>${esc(it.platz || "")}</td><td class="num">${fmtDate(it.log[it.log.length - 1].am)}</td></tr>`).join("") || `<tr><td class="l" colspan="7">Keine Teile in dieser Auswahl.</td></tr>`}
        </tbody></table></div>${rows.length > 80 ? `<p class="mini">${rows.length - 80} weitere – bitte Suche oder Filter nutzen.</p>` : ""}</div>`;
    },

    kasse() {
      const heute = iso(today0());
      const os = db.orders.filter(inStore);
      const bez = os.filter((o) => o.paid);
      const tag = (d) => bez.filter((o) => o.paid.am === d);
      const sum = (arr, art) => arr.filter((o) => !art || o.paid.art === art).reduce((s, o) => s + total(o), 0);
      const h = tag(heute);
      const offen = os.filter((o) => !o.paid && (o.status === "bereit" || o.status === "abgeholt"));
      const tage = [...Array(7)].map((_, i) => iso(new Date(today0().getTime() - i * DAY)));
      return `<div class="kpis">
          <div class="kpi"><b class="num">${euro(sum(h))}</b><small>Kassiert heute</small></div>
          <div class="kpi"><b class="num">${euro(sum(h, "Karte"))}</b><small>davon Karte</small></div>
          <div class="kpi"><b class="num">${euro(sum(h, "Bar"))}</b><small>davon Bar</small></div>
          <div class="kpi ${offen.length ? "alert" : ""}"><b class="num">${euro(offen.reduce((s, o) => s + total(o), 0))}</b><small>Noch zu kassieren (${offen.length} Aufträge)</small></div></div>
        <div class="grid2">
          <div class="panel"><h2>Zahlungen heute</h2>${h.length ? `<div class="scroll"><table class="tbl"><thead><tr><th class="l">Beleg</th><th class="l">Auftrag</th><th class="l">Kunde</th><th>Art</th><th>Betrag</th></tr></thead><tbody>${h.map((o) => `<tr class="click" data-order="${o.nr}" data-goauftrag><td class="l num">${esc(o.paid.beleg)}</td><td class="l num">${o.nr}</td><td class="l">${esc(cust(o.cust).name)}</td><td>${o.paid.art}</td><td class="num">${euro(total(o))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Heute noch keine Zahlung vermerkt.</p>`}</div>
          <div class="panel"><h2>Noch zu kassieren</h2>${list(offen.slice(0, 10), "Alles bezahlt.")}</div>
        </div>
        <div class="panel"><h2>Letzte 7 Tage</h2><div class="scroll"><table class="tbl"><thead><tr><th class="l">Tag</th><th>Zahlungen</th><th>Karte</th><th>Bar</th><th>Gesamt</th></tr></thead><tbody>
          ${tage.map((d) => { const a = tag(d); return `<tr><td class="l">${fmtDate(d)}</td><td>${a.length}</td><td>${euro(sum(a, "Karte"))}</td><td>${euro(sum(a, "Bar"))}</td><td><b>${euro(sum(a))}</b></td></tr>`; }).join("")}</tbody></table></div>
          <p class="hint" style="margin-top:10px">Abgleich: Diese Summen am Tagesende mit dem Tagesabschluss (Z-Bon) der Kasse vergleichen. Kassiert und gebucht wird ausschließlich in der zertifizierten Kasse.</p></div>`;
    },

    management() {
      if (!ui.mgmt) return `<div class="panel lock"><h2>Bereich Geschäftsleitung</h2><p class="mini">Umsatz und Kennzahlen sind nur für die Geschäftsleitung sichtbar.</p>
        <label class="field" for="pin">PIN eingeben<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
        <button class="btn" data-unlock type="button">Entsperren</button><p class="mini">Im Prototyp lautet die PIN 1234. In der echten App meldet sich jede Person mit eigenem Zugang an.</p></div>`;
      const os = db.orders.filter(inStore).filter(zaehlt);
      const bez = os.filter((o) => o.paid);
      const im = (n) => bez.filter((o) => daysSince(o.paid.am) < n).reduce((s, o) => s + total(o), 0);
      const kat = {}; os.filter((o) => daysSince(o.date) < 30).forEach((o) => { const wd = D(o.date).getDay(); o.lines.forEach((l) => { const c = ITEM[l.id].cat; kat[c] = (kat[c] || 0) + l.qty * unitPrice(l.id, wd, o.lines)[0]; }); });
      const katS = Object.entries(kat).sort((a, b) => b[1] - a[1]); const kmax = katS.length ? katS[0][1] : 1;
      const alle = db.orders.filter(inStore);
      const storno = alle.length ? Math.round(alle.filter((o) => o.status === "storniert").length / alle.length * 100) : 0;
      const kd = alle.filter((o) => (o.kd || []).length).length;
      const lieg = alle.filter((o) => o.status === "abgeholt" && o.picked).map((o) => Math.max(0, (D(o.picked) - D(o.due)) / DAY));
      const liegAvg = lieg.length ? (lieg.reduce((a, b) => a + b, 0) / lieg.length).toFixed(1).replace(".", ",") : "–";
      const offenF = alle.filter((o) => !o.paid && (o.status === "bereit" || o.status === "abgeholt")).reduce((s, o) => s + total(o), 0);
      const top = db.customers.map((c) => ({ c, s: bez.filter((o) => o.cust === c.id).reduce((s, o) => s + total(o), 0) })).filter((x) => x.s).sort((a, b) => b.s - a.s).slice(0, 5);
      const lauf = bez.filter((o) => o.cust === "LAUF").reduce((s, o) => s + total(o), 0);
      return `<div class="chips" style="justify-content:space-between"><span class="mini">Geschäftsleitung · ${ui.store === "ALL" ? "alle Geschäfte" : STORES[ui.store]}</span><button class="btn ghost small" data-lock type="button">Bereich sperren</button></div>
        <div class="kpis">
          <div class="kpi"><b class="num">${euro(im(7))}</b><small>Umsatz 7 Tage (bezahlt)</small></div>
          <div class="kpi"><b class="num">${euro(im(30))}</b><small>Umsatz 30 Tage (bezahlt)</small></div>
          <div class="kpi ${offenF ? "alert" : ""}"><b class="num">${euro(offenF)}</b><small>Offene Beträge</small></div>
          <div class="kpi"><b class="num">${storno} %</b><small>Stornoquote</small></div>
          <div class="kpi"><b class="num">${kd}</b><small>Kundendienst-Fälle</small></div>
          <div class="kpi"><b class="num">${liegAvg}</b><small>Ø Tage bis Abholung</small></div></div>
        <div class="grid2">
          <div class="panel"><h2>Auftragswert nach Bereich (30 Tage)</h2>${katS.map(([k, v]) => `<div class="hbar"><span>${k}</span><span class="track"><i style="width:${Math.round(v / kmax * 100)}%"></i></span><b class="num">${euro(v)}</b></div>`).join("")}</div>
          <div class="panel"><h2>Stärkste Kunden (bezahlt)</h2><div class="list">${top.map((x) => `<div class="row"><span class="t">${esc(x.c.name)}</span><span class="r"><b class="num">${euro(x.s)}</b></span></div>`).join("")}<div class="row"><span class="t mini">Laufkunden ohne Namen</span><span class="r"><b class="num">${euro(lauf)}</b></span></div></div></div>
        </div>
        ${VIEWS.auswertung()}`;
    },

    auswertung() {
      const t0 = today0(); const os = db.orders.filter(inStore).filter(zaehlt);
      const days = [...Array(7)].map((_, i) => iso(new Date(t0.getTime() - (6 - i) * DAY)));
      const per = days.map((d) => os.filter((o) => o.date === d).reduce((s, o) => s + total(o), 0));
      const max = Math.max(...per, 1);
      const week = per.reduce((a, b) => a + b, 0);
      const prev = os.filter((o) => daysSince(o.date) >= 7 && daysSince(o.date) < 14).reduce((s, o) => s + total(o), 0);
      const diff = prev ? Math.round((week - prev) / prev * 100) : 0;
      const cnt = {}; os.filter((o) => daysSince(o.date) < 14).forEach((o) => o.lines.forEach((l) => (cnt[l.id] = (cnt[l.id] || 0) + (ITEM[l.id].unit === "Stk" ? l.qty : 1))));
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6); const tmax = top.length ? top[0][1] : 1;
      const avg = os.length ? os.reduce((s, o) => s + total(o), 0) / os.length : 0;
      const storeRows = Object.keys(STORES).map((k) => { const so = db.orders.filter((o) => o.store === k && zaehlt(o) && daysSince(o.date) < 7); return `<tr><td>${STORES[k]}</td><td>${so.length}</td><td>${euro(so.reduce((s, o) => s + total(o), 0))}</td><td>${db.orders.filter((o) => o.store === k && o.status === "bereit").length}</td></tr>`; }).join("");
      return `<div class="kpis">
          <div class="kpi"><b class="num">${euro(week)}</b><small>Auftragswert, letzte 7 Tage</small></div>
          <div class="kpi"><b class="num">${diff >= 0 ? "+" : ""}${diff} %</b><small>gegenüber Vorwoche</small></div>
          <div class="kpi"><b class="num">${euro(avg)}</b><small>Ø pro Auftrag</small></div>
          <div class="kpi"><b class="num">${os.filter((o) => o.status !== "abgeholt").length}</b><small>Offene Aufträge</small></div></div>
        <div class="grid2">
          <div class="panel"><h2>Auftragswert pro Tag</h2>
            <div class="bars">${per.map((v, i) => `<div class="bar ${i === 6 ? "today" : ""}" title="${euro(v)}"><em class="num">${v ? Math.round(v / 100) + " €" : ""}</em><i style="height:${Math.round(v / max * 100)}%"></i></div>`).join("")}</div>
            <div class="barlabels">${days.map((d) => `<span>${D(d).toLocaleDateString("de-DE", { weekday: "short" })}</span>`).join("")}</div></div>
          <div class="panel"><h2>Meiste Teile (14 Tage)</h2>${top.map(([id, n]) => `<div class="hbar"><span>${esc(ITEM[id].name)}</span><span class="track"><i style="width:${Math.round(n / tmax * 100)}%"></i></span><b class="num">${n}</b></div>`).join("")}</div>
        </div>
        <div class="panel"><h2>Geschäfte im Vergleich (7 Tage)</h2><div class="scroll"><table class="tbl"><thead><tr><th>Geschäft</th><th>Aufträge</th><th>Auftragswert</th><th>Abholbereit</th></tr></thead><tbody>${storeRows}</tbody></table></div>
          <p class="hint" style="margin-top:10px">Auftragswert laut App. Der tatsächliche Umsatz kommt aus der Kasse.</p></div>`;
    },
  };
  const TITLES = { heute: "Heute", annahme: "Neue Annahme", auftraege: "Aufträge", teile: "Teile-Kartei", kunden: "Kunden", kasse: "Kasse", management: "Geschäftsleitung", auswertung: "Auswertung" };

  function render() {
    document.querySelectorAll("[data-nav]").forEach((b) => b.closest(".rail") && b.setAttribute("aria-current", b.dataset.nav === ui.view ? "page" : "false"));
    document.querySelectorAll("[data-store]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.store === ui.store));
    document.querySelector('[data-store="ALL"]').hidden = ui.view === "annahme";
    document.getElementById("title").textContent = TITLES[ui.view] + (ui.store === "ALL" ? " · alle Geschäfte" : ui.view === "annahme" ? " · " + STORES[ui.store].split(" (")[0] : "");
    const focus = document.activeElement && document.activeElement.id; const pos = focus && document.activeElement.selectionStart;
    document.getElementById("view").innerHTML = VIEWS[ui.view]();
    document.querySelectorAll("[data-qr]").forEach((el) => { if (window.QRCode) new QRCode(el, { text: el.dataset.qr, width: +(el.dataset.size || 176), height: +(el.dataset.size || 176), correctLevel: QRCode.CorrectLevel.L }); else el.textContent = "QR-Code lädt nicht (offline)"; });
    document.querySelectorAll("img[data-schein]").forEach((img) => { const o = db.orders.find((x) => x.nr === img.dataset.schein); if (o && window.QRCode) img.src = scheinBild(o).toDataURL("image/png"); });
    if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
    renderSync();
  }

  // ---------------------------------------------------------------- Bedienung
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button, tr[data-teil], tr[data-order]"); if (!b) return;
    const d = ui.draft, ds = b.dataset;
    if (ds.nav) { ui.view = ds.nav; ui.openOrder = ui.openCust = null; if (ui.view === "annahme" && ui.store === "ALL") ui.store = "W"; }
    else if (ds.store) { ui.store = ds.store; }
    else if (ds.filter) { ui.filter = ds.filter; }
    else if (ds.cat) { ui.cat = ds.cat; }
    else if (ds.add) { const l = d.lines.find((x) => x.id === ds.add); if (l) l.qty++; else d.lines.push({ id: ds.add, qty: ITEM[ds.add].unit === "Stk" ? 1 : 10 }); }
    else if (ds.inc) { d.lines[ds.inc].qty++; }
    else if (ds.dec) { const l = d.lines[ds.dec]; l.qty--; if (l.qty <= 0) d.lines.splice(ds.dec, 1); }
    else if (ds.cust) { d.cust = ds.cust; ui.showList = false; d.custQ = ""; }
    else if ("uncust" in ds) { d.cust = null; }
    else if ("togglelist" in ds) { ui.showList = !ui.showList; d.custQ = ""; }
    else if ("newcust" in ds) { const id = "K" + (1001 + db.customers.length); db.customers.push({ id, name: d.custQ.trim(), tel: (document.getElementById("new-tel") || {}).value?.trim() || "–", store: ui.store }); d.cust = id; change(); toast("Kunde angelegt"); }
    else if ("save" in ds) {
      const nr = (ui.store === "W" ? "W-" : "F-") + (Math.max(ui.store === "W" ? 2400 : 800, ...db.orders.filter((o) => o.store === ui.store).map((o) => +o.nr.slice(2))) + 1);
      const neu = { nr, cust: d.cust, store: ui.store, date: d.date, due: d.due, status: "arbeit", lines: d.lines.map((l) => ({ ...l })), picked: null };
      neu.items = makeItems(neu, d.date); neu.code = genCode(); db.orders.push(neu);
      ui.draft = newDraft(); change(); toast(`Auftrag ${nr} gespeichert${online() ? "" : " (auf dem Tablet)"} – Abholschein bereit`);
      ui.view = "auftraege"; ui.filter = "offen"; ui.openOrder = nr; scrollTo({ top: 0 });
    }
    else if (ds.order) { ui.openOrder = ds.order; if (ui.view !== "auftraege" && ui.view !== "heute") { ui.view = "auftraege"; ui.filter = "alle"; ui.aq = ""; } scrollTo({ top: 0, behavior: "smooth" }); }
    else if (ds.set) { const o = db.orders.find((x) => x.nr === ui.openOrder); o.status = ds.set; if (ds.set === "abgeholt") o.picked = iso(today0());
      (o.items || []).forEach((it, k) => { if (ds.set === "abgeholt" && it.st !== "ausgegeben") setItem(it, "ausgegeben"); if (ds.set === "bereit" && !["fertig", "ausgegeben"].includes(it.st)) setItem(it, "fertig", it.platz || "Stange " + (1 + k % 12)); }); change(); toast(ds.set === "abgeholt" ? "Als abgeholt vermerkt" : "Als abholbereit vermerkt"); }
    else if ("close" in ds) { ui.openOrder = null; ui.askStorno = null; }
    else if (ds.teil) { ui.view = "teile"; ui.openTeil = ds.teil; scrollTo({ top: 0, behavior: "smooth" }); }
    else if ("tclose" in ds) { ui.openTeil = null; }
    else if (ds.tset) { const f = allItems().find(({ it }) => it.tnr === ui.openTeil); setItem(f.it, ds.tset, ds.tset === "fertig" ? (f.it.platz || ui.scanPlatz || "Stange 1") : undefined); const m = syncOrder(f.o); change(); toast(`${f.it.tnr}: ${ST[ds.tset]}${m}`); }
    else if (ds.ziel) { ui.scanZiel = ds.ziel; setTimeout(() => document.getElementById("scan") && document.getElementById("scan").focus(), 0); }
    else if (ds.tfilter) { ui.tfilter = ds.tfilter; }
    else if ("unlock" in ds) { if (document.getElementById("pin").value === "1234") { ui.mgmt = true; } else { toast("PIN falsch"); return; } }
    else if ("lock" in ds) { ui.mgmt = false; }
    else if ("kd" in ds) {
      const o = db.orders.find((x) => x.nr === ui.openOrder);
      (o.kd = o.kd || []).push({ am: iso(today0()), grund: document.getElementById("kd-grund").value, notiz: document.getElementById("kd-notiz").value.trim() });
      o.status = "kundendienst"; if (o.items && o.items[0]) setItem(o.items[0], "kundendienst"); change(); toast("Beim Kundendienst vermerkt");
    }
    else if ("askstorno" in ds) { ui.askStorno = ui.openOrder; }
    else if ("nostorno" in ds) { ui.askStorno = null; }
    else if ("storno" in ds) { const o = db.orders.find((x) => x.nr === ui.openOrder); o.status = "storniert"; o.storniertAm = iso(today0()); (o.items || []).forEach((it) => it.st !== "ausgegeben" && setItem(it, "storniert")); ui.askStorno = null; change(); toast(`Auftrag ${o.nr} storniert`); }
    else if ("pay" in ds) {
      const o = db.orders.find((x) => x.nr === ui.openOrder); const nrIn = document.getElementById("p-beleg").value.trim();
      if (!nrIn) { toast("Bitte die Beleg-Nr. aus der Kasse eintragen"); document.getElementById("p-beleg").focus(); return; }
      o.paid = { beleg: nrIn, art: document.getElementById("p-art").value, am: iso(today0()) }; change(); toast(`Bezahlt vermerkt (Beleg ${nrIn})`);
    }
    else if ("zeigen" in ds) { zeigen(db.orders.find((x) => x.nr === ui.openOrder)); return; }
    else if ("teilen" in ds) { teilen(db.orders.find((x) => x.nr === ui.openOrder)); return; }
    else if ("print" in ds) { toast("Im Laden druckt das direkt auf dem Bondrucker. In dieser Vorschau wird nur angezeigt."); return; }
    else if (ds.custopen) { ui.openCust = ds.custopen; scrollTo({ top: 0, behavior: "smooth" }); }
    else if ("closecust" in ds) { ui.openCust = null; }
    else if (b.id === "offline-test") { ui.offline = !ui.offline; if (!ui.offline) { const n = db.pending; db.pending = 0; save(); if (n) toast(`${n} ${n === 1 ? "Änderung" : "Änderungen"} synchronisiert`); } }
    else if (b.id === "leer") { db = { customers: [], orders: [], tseq: { W: 100000, F: 200000 }, pending: 0 }; save(); ui.draft = newDraft(); ui.openOrder = ui.openCust = ui.openTeil = null; ui.view = "annahme"; toast("Leere Daten – bereit für den Testbetrieb"); }
    else if (b.id === "reset") { db = seed(); save(); ui.draft = newDraft(); ui.openOrder = ui.openCust = null; toast("Beispieldaten zurückgesetzt"); }
    else return;
    render();
  });
  // Scanner wirken wie eine Tastatur: Nummer + Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "pin") { e.preventDefault(); document.querySelector("[data-unlock]").click(); }
    if (e.key === "Enter" && e.target.id === "pick") {
      e.preventDefault();
      const v = e.target.value.trim(); let wert = v;
      if (v.includes("beleg.html#")) { try { const d = SCHEIN.auspacken(v.split("#")[1]); wert = `${d.n}-${d.c}`; } catch { toast("Link ist kein Abholschein"); return; } }
      const m = wert.toUpperCase().match(/([WF])\s*-?\s*(\d{3,6})\s*-?\s*([A-Z0-9]{4})?/);
      if (!m) { toast("Kein gültiger Abholcode"); return; }
      const o = db.orders.find((x) => x.nr === `${m[1]}-${m[2]}`);
      if (!o) { toast(`Auftrag ${m[1]}-${m[2]} nicht gefunden`); return; }
      ui.view = "auftraege"; ui.filter = "alle"; ui.aq = ""; ui.openOrder = o.nr; render();
      if (m[3] !== o.code) { toast(`Prüfzeichen passen nicht zu ${o.nr} – bitte Namen oder Ausweis prüfen`); return; }
      toast(o.status === "abgeholt" ? `${o.nr} wurde bereits abgeholt` : `Abholschein ${o.nr} gültig – ${o.paid ? "bezahlt" : "noch kassieren"}, dann „Abgeholt“ tippen`); return;
    }
    if (e.key !== "Enter" || e.target.id !== "scan") return;
    e.preventDefault();
    const nr = e.target.value.trim().toUpperCase().replace(/\s/g, ""); const ziel = ui.scanZiel || "reinigung";
    const f = allItems().find(({ it }) => it.tnr === nr);
    ui.scans = ui.scans || [];
    if (!f) ui.scans.unshift({ ok: false, text: `${nr || "(leer)"}: Teil nicht gefunden` });
    else { setItem(f.it, ziel, ziel === "fertig" ? (ui.scanPlatz || "Stange 1") : undefined); const m = syncOrder(f.o); change();
      ui.scans.unshift({ ok: true, text: `${f.it.tnr} ${ITEM[f.it.id].name} → ${ST[ziel]}${ziel === "fertig" ? " (" + (ui.scanPlatz || "Stange 1") + ")" : ""}${m}` }); }
    render(); const s = document.getElementById("scan"); if (s) { s.value = ""; s.focus(); }
  });
  // Kundenfeld antippen: Kundenliste klappt automatisch auf
  document.addEventListener("focusin", (e) => {
    if (e.target.id === "cust-q" && !e.target.value && !ui.showList) { ui.showList = true; render(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "cust-q") { ui.draft.custQ = t.value; render(); }
    else if (t.id === "kq") { ui.q = t.value; render(); }
    else if (t.id === "aq") { ui.aq = t.value; render(); }
    else if (t.id === "tq") { ui.tq = t.value; render(); }
    else if (t.id === "scan-platz") { ui.scanPlatz = t.value; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "d-date" && t.value) { ui.draft.date = t.value; ui.draft.due = iso(addWorkdays(new Date(t.value + "T00:00"), 3)); render(); }
    else if (t.id === "d-due" && t.value) { ui.draft.due = t.value; render(); }
  });

  save(); render();
})();
</script>
