<style>
/* Layout: App mit Reitern unten (Handy) bzw. links (breit); Druckansicht als A4-Blatt im Dialog */
:root {
  --bg: #F1F4F2;        /* Grund, leicht ins Salbeigrün */
  --surface: #FFFFFF;
  --ink: #18242E;       /* Schrift, Tintenblau */
  --muted: #5B6871;
  --line: #D8DFDB;
  --accent: #1E6F63;    /* Salbeigrün, Hauptfarbe */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDE8;
  --ok: #2E7D32; --ok-soft: #E3F1E4;
  --warn: #9A5B00; --warn-soft: #FBEFD9;
  --bad: #B3261E; --bad-soft: #FBE4E2;
  --paper: #FFFFFF; --paper-ink: #111111;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1619; --surface: #172227; --ink: #E7EEEA; --muted: #9DACA6; --line: #2A383E;
  --accent: #5CC2AE; --accent-ink: #062320; --accent-soft: #163A35;
  --ok: #7DD08A; --ok-soft: #173321; --warn: #F0B860; --warn-soft: #3A2A10; --bad: #F2948C; --bad-soft: #3D1916;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1619; --surface: #172227; --ink: #E7EEEA; --muted: #9DACA6; --line: #2A383E;
  --accent: #5CC2AE; --accent-ink: #062320; --accent-soft: #163A35;
  --ok: #7DD08A; --ok-soft: #173321; --warn: #F0B860; --warn-soft: #3A2A10; --bad: #F2948C; --bad-soft: #3D1916;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
h1, h2, h3 { overflow-wrap: anywhere; hyphens: auto; font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: 1.6rem; font-weight: 800 }
h2 { font-size: 1.25rem; font-weight: 800 }
h3 { font-size: 1.05rem; font-weight: 600 }
.num { font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.app { display: grid; grid-template-columns: 1fr; min-height: 100% }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 1040px; margin: 0 auto }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px }
.logo svg { width: 26px; height: 26px; color: var(--accent) }
.firma { color: var(--muted); font-size: .9rem; min-width: 0 }
.test { margin-left: auto; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 110px }
.view { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.view-head p { margin: 2px 0 0; color: var(--muted) }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 10px; text-decoration: none; color: var(--muted); font-size: .74rem; font-weight: 700 }
nav.tabs a svg { width: 24px; height: 24px }
nav.tabs a[aria-current="page"] { color: var(--accent) }
@media (min-width: 900px) {
  .app { grid-template-columns: 210px 1fr }
  .top { grid-column: 1 / -1 }
  nav.tabs { position: sticky; top: 64px; align-self: start; display: grid; grid-template-columns: 1fr; gap: 4px; border: 0; background: transparent; padding: 18px 0 0 max(16px, env(safe-area-inset-left, 0px)) }
  nav.tabs a { grid-template-columns: 24px 1fr; justify-items: start; align-items: center; gap: 10px; font-size: .95rem; padding: 10px 12px; border-radius: 10px }
  nav.tabs a[aria-current="page"] { background: var(--accent-soft) }
  main { padding-bottom: 40px }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0 }
.list { display: grid; gap: 10px }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.row .grow { flex: 1; min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap }
.p-plan { background: var(--accent-soft); color: var(--accent) }
.p-ok { background: var(--ok-soft); color: var(--ok) }
.p-warn { background: var(--warn-soft); color: var(--warn) }
.p-bad { background: var(--bad-soft); color: var(--bad) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; text-decoration: none }
.btn.ghost { background: transparent; color: var(--accent) }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .92rem }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad) }
.btns { display: flex; gap: 10px; flex-wrap: wrap }
.einsatz { cursor: pointer; text-align: left; width: 100%; color: inherit }
.einsatz:hover { border-color: var(--accent) }
.zeit { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; min-width: 64px }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.kpi b { display: block; font-family: var(--f-display); font-size: 1.45rem; font-weight: 800 }
.kpi span { color: var(--muted); font-size: .85rem }
.kpi.gewinn b { color: var(--accent) }

.budget { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden }
.budget i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.hint { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .9rem }
.info { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .92rem }

.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 130px; padding-top: 8px; border-bottom: 1px solid var(--line) }
.bar { display: flex; gap: 2px; align-items: end; height: 100% }
.bar i { flex: 1; border-radius: 4px 4px 0 0; min-height: 2px }
.bar .e { background: var(--accent) }
.bar .a { background: var(--muted); opacity: .55 }
.bar-labels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; font-size: .72rem; color: var(--muted); text-align: center }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }

.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .93rem }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
td.r, th.r { text-align: right; white-space: nowrap }
.buchungen { display: grid }
.buchung { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start }
.btxt { display: grid; min-width: 0 } .bnr { color: var(--muted); font-size: .85rem; padding-top: 2px }
.bbetrag { font-weight: 700; white-space: nowrap } .bbetrag.ein { color: var(--ok) }
.buchung.storno .btxt b, .buchung.storno .bbetrag { text-decoration: line-through; color: var(--muted) }
.linkbtn { justify-self: start; border: 0; background: none; padding: 4px 0; color: var(--bad); font-size: .85rem; font-weight: 700; cursor: pointer }
tr.storno td { color: var(--muted); text-decoration: line-through }

form.grid, .form { display: grid; gap: 12px }
.f2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }
label.f { display: grid; gap: 4px; font-weight: 700; font-size: .92rem }
label.f input, label.f select, label.f textarea { font-weight: 400; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg) }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; background: var(--bg); cursor: pointer; font-size: .92rem }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700 }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px }
legend { font-weight: 700; font-size: .92rem; margin-bottom: 4px }

dialog { border: 0; border-radius: 18px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--ink) }
dialog::backdrop { background: rgb(10 20 25 / .55) }
.dlg { padding: 20px; display: grid; gap: 14px }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 10px }
.x { border: 0; background: transparent; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px }
canvas.sig { width: 100%; height: 170px; background: var(--paper); border: 2px dashed var(--line); border-radius: 12px; touch-action: none; display: block }

/* Druckansicht: A4-Blatt, immer hell */
dialog.druck { width: min(860px, calc(100vw - 16px)); background: var(--bg) }
.druck-bar { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 1 }
.druck-bar .grow { flex: 1; min-width: 0 }
.blatt-wrap { padding: 16px; overflow-x: auto }
.blatt { background: var(--paper); color: var(--paper-ink); width: 210mm; min-height: 297mm; margin: 0 auto; padding: 18mm 18mm 16mm; font: 10.5pt/1.45 var(--f-body); box-shadow: 0 6px 24px rgb(0 0 0 / .18); display: grid; align-content: start; gap: 5mm }
.blatt + .blatt { margin-top: 16px }
.blatt h1 { font-size: 17pt } .blatt h2 { font-size: 12.5pt }
.blatt table { font-size: 9.5pt } .blatt th { color: #555 } .blatt th, .blatt td { border-color: #CCC; padding: 5px 4px }
.blatt .kopf { display: flex; justify-content: space-between; gap: 10mm; font-size: 9pt; color: #444 }
.blatt .summe td { font-weight: 700; border-top: 2px solid #111; border-bottom: 0 }
.blatt .fuss { margin-top: auto; font-size: 8pt; color: #666; border-top: 1px solid #CCC; padding-top: 3mm }
.blatt img.u { height: 26px; max-width: 120px }
.blatt .absender { font-size: 7.5pt; color: #666; border-bottom: 1px solid #999; display: inline-block; margin-bottom: 2mm }

@media print {
  @page { size: A4; margin: 0 }
  body { background: #fff }
  body::before, .app, dialog { display: none !important }
  #druckbereich { display: block !important }
  .blatt { box-shadow: none; margin: 0; page-break-after: always }
}
#druckbereich { display: none }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<script>
"use strict";
// ---------------------------------------------------------------- Grundlagen
const SPEICHER = "alltagshilfe-prototyp-v1";
const ENTLASTUNG = 131;                       // € je Monat, § 45b SGB XI
const HEUTE = new Date(); HEUTE.setHours(0, 0, 0, 0);
const JAHR = HEUTE.getFullYear();
const euro = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(n || 0);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const vonIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const datum = (s) => vonIso(s).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
const tagKurz = (s) => vonIso(s).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const minuten = (von, bis) => { const [a, b] = von.split(":").map(Number); const [c, d] = bis.split(":").map(Number); return c * 60 + d - (a * 60 + b); };
const dauerText = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} Std.`;
const plusTage = (n) => { const d = new Date(HEUTE); d.setDate(d.getDate() + n); return iso(d); };

// Tätigkeiten nach den Hinweisen des Landes Niedersachsen (Stand 15.10.2025)
const TAETIGKEITEN = {
  "Haushalt": ["Einkauf erledigt", "Mahlzeit zubereitet", "Wohnung gereinigt", "Wäsche gewaschen und gelegt", "Bett bezogen", "Blumen versorgt"],
  "Begleitung": ["Begleitung zum Einkauf", "Begleitung zu Arzt oder Therapie", "Botengang Post, Apotheke, Behörde", "Begleitung Friedhof oder Gottesdienst"],
  "Betreuung": ["Gespräch, Vorlesen, Spiele", "Spaziergang", "Gedächtnistraining"],
  "Organisation": ["Hilfe bei Post und Behördenschreiben"],
};
const KAT_EIN = { kasse: "Leistungen über Pflegekassen", privat: "Privat bezahlte Leistungen", sonst: "Sonstige Einnahmen" };
const KAT_AUS = { versicherung: "Versicherungen und Beiträge", fortbildung: "Fortbildung und Kurse", telefon: "Telefon und Internet", buero: "Büro und Arbeitsmittel", werbung: "Werbung", fahrt: "Fahrtkosten (Belege)", sonst: "Sonstige Ausgaben" };

// Unterschrift für Testdaten: Name in Schreibschrift auf eine Leinwand
function testUnterschrift(name) {
  const c = document.createElement("canvas"); c.width = 360; c.height = 90;
  const g = c.getContext("2d"); g.fillStyle = "#1a2a6c"; g.font = "italic 38px 'Segoe Script', 'Brush Script MT', cursive";
  g.fillText(name, 12, 60); g.strokeStyle = "#1a2a6c"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(12, 70); g.bezierCurveTo(120, 80, 220, 62, 330, 72); g.stroke();
  return c.toDataURL("image/png");
}

// ---------------------------------------------------------------- Testdaten
function testdaten() {
  const k = [
    { id: "k1", name: "Erna Beispiel", anschrift: "Lindenweg 4, 30457 Hannover", geb: "1938-03-12", pg: 2, kasse: "AOK Niedersachsen", vnr: "A123456789", angeh: "Tochter Petra Beispiel, 0151 0000001", abtretung: `${JAHR}-01-08`, vorjahr: 262 },
    { id: "k2", name: "Heinz Muster", anschrift: "Am Bach 11, 30457 Hannover", geb: "1941-09-30", pg: 3, kasse: "Techniker Krankenkasse", vnr: "T987654321", angeh: "Sohn Jens Muster, 0151 0000002", abtretung: `${JAHR}-02-03`, vorjahr: 0 },
    { id: "k3", name: "Gisela Probe", anschrift: "Kirchstraße 2, 30457 Hannover", geb: "1946-06-21", pg: 1, kasse: "BARMER", vnr: "B555666777", angeh: "", abtretung: `${JAHR}-04-15`, vorjahr: 0 },
  ];
  const e = []; let n = 1;
  const t = (k, d, von, bis, taet, km, status = "bestaetigt") => e.push({ id: "e" + n++, klient: k, datum: d, von, bis, taet, km, notiz: "", status,
    unterschrift: status === "bestaetigt" ? testUnterschrift(k === "k1" ? "E. Beispiel" : k === "k2" ? "J. Muster" : "G. Probe") : null,
    wer: status === "bestaetigt" ? (k === "k2" ? "Angehöriger (Jens Muster)" : "Klient/in") : null });
  // Eingesetzte Monate bis einschließlich Vormonat, dazu der laufende Monat
  for (let m = 0; m <= HEUTE.getMonth(); m++) {
    const d = (tag) => iso(new Date(JAHR, m, tag));
    const lauf = m === HEUTE.getMonth();
    if (!lauf || HEUTE.getDate() > 5) t("k1", d(5), "09:00", "10:30", ["Wäsche gewaschen und gelegt", "Bett bezogen", "Gespräch, Vorlesen, Spiele"], 4);
    if (!lauf || HEUTE.getDate() > 12) t("k2", d(12), "14:00", "15:30", ["Begleitung zum Einkauf", "Spaziergang"], 6);
    if (m >= 3 && (!lauf || HEUTE.getDate() > 19)) t("k3", d(19), "10:00", "11:00", ["Wohnung gereinigt", "Blumen versorgt"], 3);
    if (!lauf || HEUTE.getDate() > 22) t("k1", d(22), "09:00", "10:00", ["Einkauf erledigt", "Mahlzeit zubereitet"], 4);
  }
  t("k1", plusTage(0), "09:00", "10:30", ["Wäsche gewaschen und gelegt"], 4, "geplant");
  t("k2", plusTage(0), "14:00", "15:30", [], 6, "geplant");
  t("k3", plusTage(1), "10:00", "11:00", [], 3, "geplant");
  t("k1", plusTage(3), "09:00", "10:00", [], 4, "geplant");

  const abrechnung = {}; // "YYYY-MM|klient" -> {status, nr, buchung}
  const kb = []; let bn = 1;
  const b = (d, typ, betrag, kat, text, zahlweg = "Konto", ref = null) => kb.push({ nr: bn++, datum: d, typ, betrag, kat, text, zahlweg, ref, storno: false });
  // Ausgaben
  b(`${JAHR}-01-10`, "aus", 189, "versicherung", "Betriebshaftpflicht Jahresbeitrag");
  b(`${JAHR}-01-28`, "aus", 59, "fortbildung", "Erste-Hilfe-Kurs");
  b(`${JAHR}-03-02`, "aus", 45, "werbung", "Flyer, 250 Stück");
  b(`${JAHR}-05-14`, "aus", 23.9, "buero", "Ordner, Druckerpapier", "Bar");
  b(`${JAHR}-09-20`, "aus", 120, "fortbildung", "Aufbaukurs Demenz");

  }
  b(`${JAHR}-06-30`, "ein", 68, "privat", "Privat: Fenster putzen, 2 Std. (nicht über Entlastungsbetrag)", "Bar");
  kb.sort((a, c) => a.datum.localeCompare(c.datum)); kb.forEach((x, i) => (x.nr = i + 1));

// ---------------------------------------------------------------- Entlastungsbetrag je Klient
// Monatlich 131 € ansparen; Rest des Vorjahres zuerst verbrauchen, er verfällt nach dem 30.06.
function budget(k) {
  const bestaetigt = db.einsaetze.filter((x) => x.klient === k.id && x.status === "bestaetigt" && x.datum.startsWith(String(JAHR)));
  const bisJuni = bestaetigt.filter((x) => x.datum <= `${JAHR}-06-30`).reduce((s, x) => s + betrag(x), 0);
  const gesamt = bestaetigt.reduce((s, x) => s + betrag(x), 0);
  const ausVorjahr = Math.min(k.vorjahr, bisJuni);
  const vorjahrOffen = HEUTE <= new Date(JAHR, 5, 30) ? k.vorjahr - ausVorjahr : 0;
  const verfallen = HEUTE > new Date(JAHR, 5, 30) ? k.vorjahr - ausVorjahr : 0;
  const angespart = ENTLASTUNG * (HEUTE.getMonth() + 1);
  const ausJahr = gesamt - ausVorjahr;
  const rest = angespart - ausJahr + vorjahrOffen;
  return { angespart, ausJahr, vorjahrOffen, verfallen, rest, anteil: Math.min(1, ausJahr / angespart) };
}

// Kassenbuch und Einnahmenüberschussrechnung
function eur(jahr) {
  const kb = db.kassenbuch.filter((x) => !x.storno && x.datum.startsWith(String(jahr)));
  const ein = {}, aus = {};
  for (const x of kb) (x.typ === "ein" ? ein : aus)[x.kat] = ((x.typ === "ein" ? ein : aus)[x.kat] || 0) + x.betrag;
  const km = db.einsaetze.filter((x) => x.status === "bestaetigt" && x.datum.startsWith(String(jahr))).reduce((s, x) => s + (x.km || 0), 0);
  const kmKosten = Math.round(km * db.betrieb.km * 100) / 100;
  const summeEin = Object.values(ein).reduce((s, v) => s + v, 0);
  const summeAus = Object.values(aus).reduce((s, v) => s + v, 0) + kmKosten;
  const proMonat = Array.from({ length: 12 }, (_, i) => { const mm = `${jahr}-${String(i + 1).padStart(2, "0")}`;
    return { e: kb.filter((x) => x.typ === "ein" && x.datum.startsWith(mm)).reduce((s, x) => s + x.betrag, 0), a: kb.filter((x) => x.typ === "aus" && x.datum.startsWith(mm)).reduce((s, x) => s + x.betrag, 0) }; });
  return { ein, aus, km, kmKosten, summeEin, summeAus, gewinn: summeEin - summeAus, proMonat, kb };
}

    <p class="small muted">Später möglich: Bestätigung durch Angehörige per Link aufs Handy.</p>
    <div class="btns"><button class="btn" data-bestaetigen="${x.id}" type="button">Bestätigen</button><button class="btn ghost" data-sig-neu type="button">Neu unterschreiben</button></div>
    <p class="small" id="sig-fehler" hidden style="color:var(--bad)">Bitte erst unterschreiben und mindestens eine Tätigkeit wählen.</p>`);
  const c = dlg.querySelector("#sig"); const r = c.getBoundingClientRect(); const s = devicePixelRatio || 1;
  c.width = r.width * s; c.height = r.height * s; const g = c.getContext("2d"); g.scale(s, s); g.lineWidth = 2.4; g.lineCap = "round"; g.strokeStyle = "#1a2a6c";
  let zeichnet = false; c.dataset.leer = "1";
  const p = (e) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener("pointerdown", (e) => { zeichnet = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...p(e)); });
  c.addEventListener("pointermove", (e) => { if (!zeichnet) return; g.lineTo(...p(e)); g.stroke(); c.dataset.leer = "0"; });
  c.addEventListener("pointerup", () => (zeichnet = false));
}

function klientDialog() {
  oeffne(`<div class="dlg-head"><h2>Klient aufnehmen</h2><button class="x" data-zu type="button" aria-label="Schließen">×</button></div>
    <form class="form" id="klient-form">
      <label class="f" for="k-name">Name<input id="k-name" required autocomplete="off"></label>
      <label class="f" for="k-anschrift">Anschrift<input id="k-anschrift" autocomplete="off"></label>
      <div class="f2"><label class="f" for="k-pg">Pflegegrad<select id="k-pg">${[1, 2, 3, 4, 5].map((n) => `<option>${n}</option>`).join("")}</select></label>
        <label class="f" for="k-kasse">Pflegekasse<input id="k-kasse" required autocomplete="off" placeholder="z. B. AOK Niedersachsen"></label></div>
      <div class="f2"><label class="f" for="k-vnr">Versichertennummer<input id="k-vnr" autocomplete="off"></label><label class="f" for="k-vorjahr">Rest aus ${JAHR - 1} in €<input id="k-vorjahr" type="number" inputmode="decimal" value="0"></label></div>
      <label class="f" for="k-angeh">Angehörige (Name, Telefon)<input id="k-angeh" autocomplete="off"></label>
      <label class="f" for="k-abtretung">Abtretungserklärung unterschrieben am<input id="k-abtretung" type="date" value="${iso(HEUTE)}"></label>
      <p class="small muted">Nur was für Einsatz und Abrechnung nötig ist. Keine Diagnosen.</p>

function einsatzNeuDialog() {
  oeffne(`<div class="dlg-head"><h2>Einsatz planen</h2><button class="x" data-zu type="button" aria-label="Schließen">×</button></div>
    <form class="form" id="einsatz-form">
      <label class="f" for="n-klient">Klient<select id="n-klient">${db.klienten.map((k) => `<option value="${k.id}">${esc(k.name)}</option>`).join("")}</select></label>
      <div class="f2"><label class="f" for="n-datum">Datum<input id="n-datum" type="date" value="${plusTage(1)}"></label><label class="f" for="n-von">Beginn<input id="n-von" type="time" value="10:00"></label><label class="f" for="n-bis">Ende<input id="n-bis" type="time" value="11:30"></label></div>
      <div class="btns"><button class="btn" type="submit">Einplanen</button></div></form>`);

function buchungDialog(typ) {
  const kat = typ === "ein" ? KAT_EIN : KAT_AUS; const erste = Object.keys(kat)[typ === "ein" ? 1 : 0];
  oeffne(`<div class="dlg-head"><h2>${typ === "ein" ? "Einnahme" : "Ausgabe"} erfassen</h2><button class="x" data-zu type="button" aria-label="Schließen">×</button></div>
    <form class="form" id="buchung-form" data-typ="${typ}">
      <div class="f2"><label class="f" for="bu-betrag">Betrag in €<input id="bu-betrag" type="number" step="0.01" min="0.01" inputmode="decimal" required></label><label class="f" for="bu-datum">Datum<input id="bu-datum" type="date" value="${iso(HEUTE)}" required></label></div>
      <fieldset><legend>Wofür?</legend><div class="chips">${Object.entries(kat).filter(([k]) => typ === "aus" || k !== "kasse").map(([k, t]) => `<button type="button" class="chip" aria-pressed="${k === erste}" data-kat="${k}">${t}</button>`).join("")}</div></fieldset>
      <label class="f" for="bu-text">Beschreibung<input id="bu-text" required autocomplete="off" placeholder="${typ === "ein" ? "z. B. Privat: Gardinen aufhängen" : "z. B. Druckerpatrone"}"></label>
      <fieldset><legend>Bezahlt</legend><div class="chips"><button type="button" class="chip" aria-pressed="true" data-zahl="Konto">Über das Konto</button><button type="button" class="chip" aria-pressed="false" data-zahl="Bar">Bar</button></div></fieldset>
      <label class="f" for="bu-beleg">Beleg (Foto, freiwillig)<input id="bu-beleg" type="file" accept="image/*"></label>
      <div class="btns"><button class="btn" type="submit">Buchen</button></div></form>`);
}

// ---------------------------------------------------------------- Druckansichten (A4)
function absenderZeile() { const b = db.betrieb; return `${esc(b.name)} · ${esc(b.inhaber)} · ${esc(b.anschrift)}`; }
function fuss() { const b = db.betrieb; return `<div class="fuss">${esc(b.name)}, Inh. ${esc(b.inhaber)} · ${esc(b.anschrift)} · Tel. ${esc(b.tel)} · Steuernummer ${esc(b.stnr)} · IK ${esc(b.ik)} · IBAN ${esc(b.iban)}</div>`; }

function rechnungHtml(key) {
  const [ym, kid] = key.split("|"); const k = klient(kid); const b = db.betrieb; const a = db.abrechnung[key];
  const liste = db.einsaetze.filter((x) => x.klient === kid && x.status === "bestaetigt" && x.datum.startsWith(ym)).sort((p, q) => p.datum.localeCompare(q.datum));
  const summe = liste.reduce((s, x) => s + betrag(x), 0); const [y, m] = ym.split("-").map(Number);
  const nr = a ? a.nr : "(wird beim Abrechnen vergeben)";
  return `<section class="blatt"><div><span class="absender">${absenderZeile()}</span><br><b>${esc(k.kasse)}</b><br>Abrechnung Entlastungsbetrag</div>
    <div class="kopf"><div><h1>Rechnung</h1>Nr. ${nr}<br>Datum ${datum(iso(HEUTE))}</div><div style="text-align:right">Leistungszeitraum<br><b>${MONATE[m - 1]} ${y}</b></div></div>
    <div>Versicherte Person: <b>${esc(k.name)}</b>, geb. ${datum(k.geb)}, ${esc(k.anschrift)}<br>Versichertennummer ${esc(k.vnr)} · Pflegegrad ${k.pg} · Abtretungserklärung vom ${datum(k.abtretung)}</div>
    <div>Leistungen eines Angebots zur Unterstützung im Alltag nach § 45a SGB XI, abgerechnet über den Entlastungsbetrag nach § 45b SGB XI. Anerkennung ${esc(b.anerkennung)}.</div>
    <table class="num"><thead><tr><th>Datum</th><th>Zeit</th><th>Leistung</th><th class="r">Std.</th><th class="r">Betrag</th></tr></thead><tbody>
      ${liste.map((x) => `<tr><td>${datum(x.datum)}</td><td>${x.von}–${x.bis}</td><td>${x.taet.join(", ")}</td><td class="r">${(minuten(x.von, x.bis) / 60).toLocaleString("de-DE", { minimumFractionDigits: 2 })}</td><td class="r">${euro(betrag(x))}</td></tr>`).join("")}
      <tr class="summe"><td colspan="4">Gesamtbetrag (Stundensatz ${euro(b.satz)})</td><td class="r">${euro(summe)}</td></tr></tbody></table>
    <div>${steuerSatz()}<br>Bitte überweisen Sie den Betrag innerhalb von 30 Tagen auf IBAN ${esc(b.iban)}, Verwendungszweck ${nr}.</div>
    ${fuss()}</section>
  <section class="blatt"><h1>Leistungsnachweis ${MONATE[m - 1]} ${y}</h1>
    <div>${esc(k.name)} · Versichertennummer ${esc(k.vnr)} · Pflegegrad ${k.pg}<br>Anlage zu Rechnung ${nr}</div>
    <table class="num"><thead><tr><th>Datum</th><th>Zeit</th><th>Tätigkeiten</th><th>Bestätigt von</th><th>Unterschrift</th></tr></thead><tbody>
      ${liste.map((x) => `<tr><td>${datum(x.datum)}</td><td>${x.von}–${x.bis}</td><td>${x.taet.join(", ")}</td><td>${esc(x.wer || "")}</td><td>${x.unterschrift ? `<img class="u" src="${x.unterschrift}" alt="Unterschrift">` : ""}</td></tr>`).join("")}</tbody></table>
    <div>Erbracht durch ${esc(b.inhaber)}.</div>${fuss()}</section>`;
}

function eurHtml(jahr) {
  const r = eur(jahr); const b = db.betrieb; const bis = jahr === JAHR ? `bis ${datum(iso(HEUTE))}` : "ganzes Jahr";
  return `<section class="blatt"><div class="kopf"><div><h1>Einnahmenüberschussrechnung ${jahr}</h1>Zeitraum 01.01.${jahr} ${bis}</div><div style="text-align:right">${esc(b.name)}<br>${esc(b.inhaber)}<br>Steuernummer ${esc(b.stnr)}</div></div>
    <div class="blatt-eur">${eurTabelle(r)}</div>
    <h2>Buchungen</h2>
    <table class="num"><thead><tr><th>Nr.</th><th>Datum</th><th>Beschreibung</th><th>Art</th><th class="r">Betrag</th></tr></thead><tbody>
      ${r.kb.map((x) => `<tr><td>${x.nr}</td><td>${datum(x.datum)}</td><td>${esc(x.text)}</td><td>${x.typ === "ein" ? KAT_EIN[x.kat] : KAT_AUS[x.kat]}, ${x.zahlweg}</td><td class="r">${x.typ === "ein" ? "" : "−"}${euro(x.betrag)}</td></tr>`).join("")}</tbody></table>
    <div class="small">Übersicht aus dem Kassenbuch der App. Die amtliche Anlage EÜR wird über ELSTER übermittelt; diese Aufstellung dient als Grundlage dafür und für die Steuerberatung.</div>
    ${fuss()}</section>`;
}

function zeigeDruck(titel, html) {
  druck.innerHTML = `<div class="druck-bar"><div class="grow"><b>${titel}</b><br><span class="small muted">A4-Ansicht. In der fertigen App öffnet „Drucken“ den Druckdialog, dort auch „Als PDF sichern“.</span></div>
    <button class="btn" data-drucken type="button">Drucken</button><button class="btn ghost" data-druck-zu type="button">Schließen</button></div><div class="blatt-wrap">${html}</div>`;
  document.getElementById("druckbereich").innerHTML = html;
  druck.showModal();
}

// ---------------------------------------------------------------- Ereignisse
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-einsatz]"); if (!t) return;
  const d = t.dataset;
  if ("zu" in d) dlg.close();
  else if ("druckZu" in d) druck.close();
  else if ("drucken" in d) window.print();
  else if (d.einsatz) einsatzDialog(d.einsatz);
  else if (d.taet !== undefined && !t.disabled) t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true");
  else if (d.unterschrift) unterschriftDialog(einsatzLesen());
  else if (d.wer) dlg.querySelectorAll("[data-wer]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if ("sigNeu" in d) { const c = dlg.querySelector("#sig"); c.getContext("2d").clearRect(0, 0, c.width, c.height); c.dataset.leer = "1"; }
  else if (d.bestaetigen) {
    const x = db.einsaetze.find((y) => y.id === d.bestaetigen); const c = dlg.querySelector("#sig");
    if (c.dataset.leer === "1" || !x.taet.length) { dlg.querySelector("#sig-fehler").hidden = false; return; }
    x.status = "bestaetigt"; x.unterschrift = c.toDataURL("image/png"); x.wer = dlg.querySelector("[data-wer][aria-pressed=true]").dataset.wer;
    speichern(); dlg.close(); route();
  }
  else if ("neuEinsatz" in d) einsatzNeuDialog();
  else if ("neuKlient" in d) klientDialog();
  else if (d.rechnung) zeigeDruck("Rechnung und Leistungsnachweis", rechnungHtml(d.rechnung));
  else if (d.abrechnen) { db.abrechnung[d.abrechnen] = { status: "abgerechnet", nr: `${d.abrechnen.slice(0, 7).replace("-", "")}-${String(db.rnZaehler++).padStart(3, "0")}` }; speichern(); route(); }
  else if (d.bezahlt) {
    const a = db.abrechnung[d.bezahlt]; const [ym, kid] = d.bezahlt.split("|");
    const summe = db.einsaetze.filter((x) => x.klient === kid && x.status === "bestaetigt" && x.datum.startsWith(ym)).reduce((s, x) => s + betrag(x), 0);
    db.kassenbuch.push({ nr: db.kassenbuch.length + 1, datum: iso(HEUTE), typ: "ein", betrag: summe, kat: "kasse", text: `Zahlung Rechnung ${a.nr} (${klient(kid).kasse})`, zahlweg: "Konto", ref: d.bezahlt, storno: false });
    a.status = "bezahlt"; speichern(); route();
  }
  else if (d.buchung) buchungDialog(d.buchung);
  else if (d.kat) dlg.querySelectorAll("[data-kat]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (d.zahl) dlg.querySelectorAll("[data-zahl]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (d.storno) { const x = db.kassenbuch.find((y) => y.nr === Number(d.storno)); if (t.dataset.sicher) { x.storno = true; speichern(); route(); } else { t.dataset.sicher = "1"; t.textContent = "Wirklich stornieren? Noch einmal tippen."; } }
  else if ("kbAlle" in d) { kbAlle = !kbAlle; route(); }
  else if ("eur" in d) zeigeDruck(`Einnahmenüberschussrechnung ${kbJahr}`, eurHtml(kbJahr));
  else if ("reset" in d) { const h = document.getElementById("reset-hinweis"); if (h.hidden) { h.hidden = false; return; } db = testdaten(); speichern(); location.hash = "#heute"; route(); }
});
dlg.addEventListener("close", () => { if (dlg.dataset.einsatz) { einsatzLesen(); delete dlg.dataset.einsatz; route(); } });
document.addEventListener("change", (e) => { if (e.target.id === "ab-monat") { abMonat = e.target.value; route(); } });
document.addEventListener("submit", async (e) => {
  e.preventDefault(); const f = e.target; const v = (id) => f.querySelector("#" + id).value.trim();
  if (f.id === "betrieb-form") {
    Object.assign(db.betrieb, { name: v("b-name"), inhaber: v("b-inhaber"), anschrift: v("b-anschrift"), tel: v("b-tel"), stnr: v("b-stnr"), ik: v("b-ik"), anerkennung: v("b-anerkennung"), iban: v("b-iban"), satz: Number(v("b-satz")) || 0, km: Number(v("b-km")) || 0, steuer: v("b-steuer") });
    speichern(); route(); return;
  }
  if (f.id === "klient-form") {
    db.klienten.push({ id: "k" + Date.now(), name: v("k-name"), anschrift: v("k-anschrift"), geb: "1940-01-01", pg: Number(v("k-pg")), kasse: v("k-kasse"), vnr: v("k-vnr"), angeh: v("k-angeh"), abtretung: v("k-abtretung") || iso(HEUTE), vorjahr: Number(v("k-vorjahr")) || 0 });
  } else if (f.id === "einsatz-form") {
    db.einsaetze.push({ id: "e" + Date.now(), klient: v("n-klient"), datum: v("n-datum"), von: v("n-von"), bis: v("n-bis"), taet: [], km: 0, notiz: "", status: "geplant", unterschrift: null, wer: null });
  } else if (f.id === "buchung-form") {
    let beleg = null; const datei = f.querySelector("#bu-beleg").files[0];
    if (datei) beleg = await verkleinern(datei);
    db.kassenbuch.push({ nr: db.kassenbuch.length + 1, datum: v("bu-datum"), typ: f.dataset.typ, betrag: Math.round(Number(v("bu-betrag")) * 100) / 100,
      kat: f.querySelector("[data-kat][aria-pressed=true]").dataset.kat, text: v("bu-text"), zahlweg: f.querySelector("[data-zahl][aria-pressed=true]").dataset.zahl, ref: null, storno: false, beleg });
  }
  speichern(); dlg.close(); route();
});
// Belegfoto klein rechnen, damit der Speicher reicht
function verkleinern(datei) {
  return new Promise((ok) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 600 / img.width); const c = document.createElement("canvas");
    c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .7)); };
    img.onerror = () => ok(null); img.src = URL.createObjectURL(datei); });
}

route();
</script>
