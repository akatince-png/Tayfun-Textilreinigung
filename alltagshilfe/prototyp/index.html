<style>

:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1619; --surface: #172227; --ink: #E7EEEA; --muted: #9DACA6; --line: #2A383E;
  --accent: #5CC2AE; --accent-ink: #062320; --accent-soft: #163A35;
  --ok: #7DD08A; --ok-soft: #173321; --warn: #F0B860; --warn-soft: #3A2A10; --bad: #F2948C; --bad-soft: #3D1916;
  --rolle: #AEB9F0; --rolle-soft: #232B4A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1619; --surface: #172227; --ink: #E7EEEA; --muted: #9DACA6; --line: #2A383E;
  --accent: #5CC2AE; --accent-ink: #062320; --accent-soft: #163A35;
  --ok: #7DD08A; --ok-soft: #173321; --warn: #F0B860; --warn-soft: #3A2A10; --bad: #F2948C; --bad-soft: #3D1916;
  --rolle: #AEB9F0; --rolle-soft: #232B4A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);

.top-in { max-width: 1080px; margin: 0 auto; display: grid; gap: 8px }
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 1.12rem; display: flex; align-items: center; gap: 8px }
.logo svg { width: 26px; height: 26px; color: var(--accent) }
.test { margin-left: auto; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px }
.rollen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px }

.reiter button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: .92rem; cursor: pointer; white-space: nowrap; color: var(--muted) }

.termin { font-size: .82rem; border-radius: 8px; padding: 6px 8px; background: var(--accent-soft); line-height: 1.3; border: 0; text-align: left; cursor: pointer; color: var(--ink) }

.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .93rem }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top }

td.r, th.r { text-align: right; white-space: nowrap }
.protokoll { display: grid }

.form { display: grid; gap: 12px }
.f2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
label.f { display: grid; gap: 4px; font-weight: 700; font-size: .92rem }
label.f input, label.f select, label.f textarea { font-weight: 400; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100% }
.chips { display: flex; flex-wrap: wrap; gap: 8px }

legend { font-weight: 700; font-size: .92rem; margin-bottom: 4px; padding: 0 }
.schalter { display: flex; gap: 10px; align-items: center; font-weight: 700 }

.gross { font-size: 1.2rem }

.naechster b { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1 }

dialog { border: 0; border-radius: 18px; padding: 0; width: min(660px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--ink) }
dialog::backdrop { background: rgb(10 20 25 / .55) }
.dlg { padding: 20px; display: grid; gap: 14px }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 10px }
.x { border: 0; background: transparent; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px }
canvas.sig { width: 100%; height: 170px; background: var(--paper); border: 2px dashed var(--line); border-radius: 12px; touch-action: none; display: block }

dialog.druck { width: min(860px, calc(100vw - 16px)); background: var(--bg) }
.druck-bar { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 1 }

.blatt-wrap { padding: 16px; overflow-x: auto }
.blatt { background: var(--paper); color: var(--paper-ink); width: 210mm; min-height: 297mm; margin: 0 auto; padding: 18mm 18mm 16mm; font: 10.5pt/1.45 var(--f-body); box-shadow: 0 6px 24px rgb(0 0 0 / .18); display: grid; align-content: start; gap: 5mm }

.blatt .kopf { display: flex; justify-content: space-between; gap: 10mm; font-size: 9pt; color: #444 }
.blatt .summe td { font-weight: 700; border-top: 2px solid #111; border-bottom: 0 }
.blatt .fuss { margin-top: auto; font-size: 8pt; color: #666; border-top: 1px solid #CCC; padding-top: 3mm }
.blatt img.u { height: 26px; max-width: 120px }
.blatt .absender { font-size: 7.5pt; color: #666; border-bottom: 1px solid #999; display: inline-block; margin-bottom: 2mm }

@media print {

  body { background: #fff }

  #druckbereich { display: block !important }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

<script>

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// Termine einer Serie anlegen: fester Wochentag, jede oder jede 2. Woche
function erzeugeTermine(d, s, von, bis) {
  const start = vonIso(s.ab); while (start.getDay() !== s.tag) start.setDate(start.getDate() + 1);
  const t0 = vonIso(von > s.ab ? von : s.ab); while (t0.getDay() !== s.tag) t0.setDate(t0.getDate() + 1);
  for (const t = t0; iso(t) <= bis; t.setDate(t.getDate() + 7)) {
    if (Math.round((t - start) / 6048e5) % s.alle) continue;
    const tag = iso(t); if (s.bisDatum && tag > s.bisDatum) break;
    if (d.einsaetze.some((e) => e.serie === s.id && e.datum === tag)) continue;
    d.einsaetze.push({ id: "e" + d.n++, serie: s.id, klient: s.klient, helfer: s.helfer, datum: tag, von: s.von, bis: s.bis, taet: [], km: 0, protokoll: "", vermerke: [], status: "geplant" });
  }
}
function abstand(d, e) {   // Hin und zurück: Luftlinie mal 1,3 als Straßen-Schätzung
  const k = d.klienten.find((x) => x.id === e.klient), h = d.helfer.find((x) => x.id === e.helfer);
  return Math.hypot(k.x - h.x, k.y - h.y) * 1.3 * 2;
}
function betragVon(d, e) { const h = d.helfer.find((x) => x.id === e.helfer); return Math.round(minuten(e.von, e.bis) / 60 * h.satz * 100) / 100; }

// Entlastungsbetrag: monatlich 131 € ansparen, Vorjahresrest zuerst verbrauchen, er verfällt nach dem 30.06.
function budget(k) {
  const best = db.einsaetze.filter((x) => x.klient === k.id && ["bestaetigt", "wartet"].includes(x.status) && x.datum.startsWith(String(JAHR)));
  const bisJuni = best.filter((x) => x.datum <= `${JAHR}-06-30`).reduce((s, x) => s + betrag(x), 0);
  const gesamt = best.reduce((s, x) => s + betrag(x), 0);
  const ausVorjahr = Math.min(k.vorjahr, bisJuni);
  const vorjahrOffen = HEUTE <= new Date(JAHR, 5, 30) ? k.vorjahr - ausVorjahr : 0;
  const verfallen = HEUTE > new Date(JAHR, 5, 30) ? k.vorjahr - ausVorjahr : 0;
  const angespart = ENTLASTUNG * (HEUTE.getMonth() + 1);
  const ausJahr = gesamt - ausVorjahr;
  return { angespart, ausJahr, vorjahrOffen, verfallen, rest: angespart - ausJahr + vorjahrOffen, anteil: Math.min(1, ausJahr / angespart) };
}
const monatsKosten = (s) => minuten(s.von, s.bis) / 60 * helfer(s.helfer).satz * 52 / 12 / s.alle;
const kostenSerien = (kid) => db.serien.filter((s) => s.klient === kid && !s.bisDatum).reduce((a, s) => a + monatsKosten(s), 0);

function konflikt(h, dat, von, bis) {

}

function tour(hid, dat) {

  let pos = { x: h.x, y: h.y }, km = 0, ende = null;
  const schritte = halte.map((e) => { const k = klient(e.klient); const d = Math.hypot(k.x - pos.x, k.y - pos.y) * 1.3; const min = Math.max(4, Math.round(d / 25 * 60));
    const knapp = ende !== null && zuMin(e.von) - ende < min; km += d; pos = k; ende = zuMin(e.bis); return { e, k, km: d, min, knapp }; });

}

function tourKarte(t, tag, fuerBegleiterin) {
  if (!t.schritte.length) return `<div class="card muted">${tagLang(tag)}: keine Einsätze.</div>`;
  const pts = [{ x: t.h.x, y: t.h.y }, ...t.schritte.map((s) => s.k)];
  const minX = Math.min(...pts.map((p) => p.x)) - .5, maxX = Math.max(...pts.map((p) => p.x)) + 2.4, minY = Math.min(...pts.map((p) => p.y)) - .6, maxY = Math.max(...pts.map((p) => p.y)) + .6;
  const W = 600, H = Math.round(Math.max(200, Math.min(340, W * (maxY - minY) / (maxX - minX))));
  const px = (p) => [Math.round((p.x - minX) / (maxX - minX) * W), Math.round(H - (p.y - minY) / (maxY - minY) * H)];
  const linie = [...pts, pts[0]].map((p) => px(p).join(",")).join(" ");
  return `<div class="grid2"><section class="card"><h2>${tagLang(tag)}</h2><div class="tour">
      <div class="halt start"><span class="nr">⌂</span><span><b>Start</b> <span class="muted small">${esc(t.h.ort)}</span></span></div>
      ${t.schritte.map((s, i) => `<div class="fahrt"><span></span><span class="num">${km1(s.km)} km · ca. ${s.min} Min.${s.knapp ? ` <span class="pill p-warn">knapp</span>` : ""}</span></div>
        <div class="halt"><span class="nr">${i + 1}</span><span><b class="num">${s.e.von}–${s.e.bis}</b> · ${esc(s.k.name)}<br><span class="small muted">${esc(s.k.anschrift)}</span>
          ${fuerBegleiterin ? `<span class="btns" style="margin-top:6px"><a class="btn small ghost" href="https://www.google.com/maps/dir/?api=1&amp;destination=${encodeURIComponent(s.k.anschrift)}" target="_blank" rel="noopener">Route</a>${s.e.status === "geplant" ? `<button class="btn small" data-einsatz="${s.e.id}" type="button">Einsatz erfassen</button>` : statusPill(s.e)}</span>` : ` ${statusPill(s.e)}`}</span></div>`).join("")}
      <div class="fahrt"><span></span><span class="num">${km1(t.heim)} km zurück</span></div>
      <div class="halt start"><span class="nr">⌂</span><span><b>Ende</b> · gesamt <b class="num">${km1(t.km)} km</b></span></div></div></section>
    <section class="card"><h2>Lageskizze</h2><svg class="karte-svg" viewBox="-24 -24 ${W + 48} ${H + 48}" role="img" aria-label="Skizze der Tour mit ${t.schritte.length} Stationen">
      <polyline points="${linie}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
      ${pts.map((p, i) => { const [x, y] = px(p); return `<circle cx="${x}" cy="${y}" r="20" fill="${i ? "var(--accent)" : "var(--rolle)"}"/><text x="${x}" y="${y + 7}" text-anchor="middle" font-size="19" font-weight="700" fill="${i ? "var(--accent-ink)" : "var(--surface)"}">${i || "⌂"}</text>${i ? `<text x="${x + 27}" y="${y + 7}" font-size="21" font-weight="700" fill="var(--ink)">${esc(t.schritte[i - 1].k.name)}</text>` : ""}`; }).join("")}
    </svg><p class="small muted">Skizze nach Luftlinie. Die fertige App rechnet Strecken über einen Kartendienst.</p></section></div>`;
}

function beglHeute() {

function beglWoche() {

  return `<section class="card"><div class="row"><h2 class="grow">Woche ab ${datum(ui.woche)}</h2><div class="btns"><button class="btn small ghost" data-woche="-7" type="button" aria-label="Vorige Woche">‹</button><button class="btn small ghost" data-woche="0" type="button">Heute</button><button class="btn small ghost" data-woche="7" type="button" aria-label="Nächste Woche">›</button></div></div>

}
function beglZahlen() {
  const r = eur(ui.h, JAHR);
  const monat = db.einsaetze.filter((e) => e.helfer === ui.h && ["bestaetigt", "wartet"].includes(e.status) && e.datum.startsWith(HEUTE_ISO.slice(0, 7)));
  const alle = db.kassenbuch.filter((x) => x.helfer === ui.h && x.datum.startsWith(String(JAHR))).sort((a, b) => b.nr - a.nr);
  return `<div class="kpis num"><div class="kpi"><span>Stunden ${MONATE[HEUTE.getMonth()]}</span><b>${dauerText(monat.reduce((s, e) => s + minuten(e.von, e.bis), 0))}</b></div>

      <div class="btns"><button class="btn small" data-buchung="aus" type="button">+ Ausgabe</button><button class="btn small ghost" data-buchung="ein" type="button">+ Einnahme</button><button class="btn small ghost" data-eur type="button">EÜR als PDF</button></div>
      ${eurTabelle(r)}
      <h3>Buchungen</h3><div class="protokoll">${alle.slice(0, ui.kbAlle ? alle.length : 6).map((x) => `<div class="eintrag"><span class="d num">Nr. ${x.nr}<br>${tagKurz(x.datum)}</span><span class="row"><span class="grow${x.storno ? " muted" : ""}"${x.storno ? ' style="text-decoration:line-through"' : ""}>${esc(x.text)}<br><span class="small muted">${x.typ === "ein" ? KAT_EIN[x.kat] : KAT_AUS[x.kat]} · ${x.zahlweg}</span></span>
        <b class="num" style="color:${x.typ === "ein" ? "var(--ok)" : "var(--ink)"}">${x.typ === "ein" ? "+" : "−"}${euro(x.betrag)}</b>${x.storno || x.ref ? "" : `<button class="btn small danger" data-storno="${x.helfer}:${x.nr}" type="button">Stornieren</button>`}</span></div>`).join("")}</div>
      ${alle.length > 6 ? `<button class="btn small ghost" data-kb-alle type="button">${ui.kbAlle ? "Weniger zeigen" : `Alle ${alle.length} zeigen`}</button>` : ""}
      <p class="small muted">Fortlaufend nummeriert, stornieren statt löschen.</p></section>`;
}
function eur(hid, jahr) {
  const kb = db.kassenbuch.filter((x) => x.helfer === hid && !x.storno && x.datum.startsWith(String(jahr)));
  const ein = {}, aus = {};
  for (const x of kb) { const z = x.typ === "ein" ? ein : aus; z[x.kat] = (z[x.kat] || 0) + x.betrag; }
  const km = db.einsaetze.filter((e) => e.helfer === hid && ["bestaetigt", "wartet"].includes(e.status) && e.datum.startsWith(String(jahr))).reduce((s, e) => s + (e.km || 0), 0);
  const kmKosten = Math.round(km * 0.30 * 100) / 100;
  const summeEin = Object.values(ein).reduce((s, v) => s + v, 0), summeAus = Object.values(aus).reduce((s, v) => s + v, 0) + kmKosten;
  return { ein, aus, km: Math.round(km), kmKosten, summeEin, summeAus, gewinn: summeEin - summeAus, kb };
}
function eurTabelle(r) {
  const z = (t, v) => `<tr><td>${t}</td><td class="r">${euro(v)}</td></tr>`;
  return `<div class="table-wrap"><table class="num"><tbody>
    <tr><th colspan="2">Betriebseinnahmen</th></tr>${Object.entries(KAT_EIN).map(([k, t]) => (r.ein[k] ? z(t, r.ein[k]) : "")).join("")}
    <tr class="summe"><td><b>Summe Einnahmen</b></td><td class="r"><b>${euro(r.summeEin)}</b></td></tr>
    <tr><th colspan="2">Betriebsausgaben</th></tr>${Object.entries(KAT_AUS).map(([k, t]) => (r.aus[k] ? z(t, r.aus[k]) : "")).join("")}
    ${z(`Fahrten mit dem eigenen Auto (${r.km} km × 0,30 €, aus den Einsätzen)`, r.kmKosten)}
    <tr class="summe"><td><b>Summe Ausgaben</b></td><td class="r"><b>${euro(r.summeAus)}</b></td></tr>
    <tr class="summe"><td><b>Gewinn</b></td><td class="r"><b>${euro(r.gewinn)}</b></td></tr></tbody></table></div>`;
}

  const n = kommend[0];
  const zuletzt = db.einsaetze.filter((e) => e.klient === k.id && ["bestaetigt", "wartet"].includes(e.status)).sort((a, c) => c.datum.localeCompare(a.datum)).slice(0, 5);
  return `<div class="gross view">

  c.width = r.width * s; c.height = r.height * s; const g = c.getContext("2d"); g.scale(s, s); g.lineWidth = 2.4; g.lineCap = "round"; g.strokeStyle = "#1a2a6c";

  return `<section class="blatt"><div><span class="absender">${esc(h.name)} · Angebot zur Unterstützung im Alltag</span><br><b>${esc(k.kasse)}</b><br>Abrechnung Entlastungsbetrag</div>
    <div class="kopf"><div><h1>Rechnung</h1>Nr. ${nr}<br>Datum ${datum(HEUTE_ISO)}</div><div style="text-align:right">Leistungszeitraum<br><b>${MONATE[m - 1]} ${y}</b></div></div>
    <div>Versicherte Person: <b>${esc(k.name)}</b>, geb. ${datum(k.geb)}, ${esc(k.anschrift)}<br>Versichertennummer ${esc(k.vnr)} · Pflegegrad ${k.pg} · Abtretungserklärung vom ${datum(k.abtretung)}</div>
    <div>Leistungen nach § 45a SGB XI, abgerechnet über den Entlastungsbetrag nach § 45b SGB XI. Anerkennung ${esc(h.anerkennung)}.</div>
    <table class="num"><thead><tr><th>Datum</th><th>Zeit</th><th>Leistung</th><th class="r">Betrag</th></tr></thead><tbody>
      ${l.map((e) => `<tr><td>${datum(e.datum)}</td><td>${e.von}–${e.bis}</td><td>${e.taet.join(", ")}</td><td class="r">${euro(betrag(e))}</td></tr>`).join("")}
      <tr class="summe"><td colspan="3">Gesamtbetrag (Stundensatz ${euro(h.satz)})</td><td class="r">${euro(summe)}</td></tr></tbody></table>
    <div>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.<br>Bitte überweisen Sie den Betrag innerhalb von 30 Tagen auf IBAN ${esc(h.iban)}, Verwendungszweck ${nr}.</div>${fussH(h)}</section>
  <section class="blatt"><h1>Leistungsnachweis ${MONATE[m - 1]} ${y}</h1><div>${esc(k.name)} · Vers.-Nr. ${esc(k.vnr)} · Anlage zu Rechnung ${nr} · erbracht durch ${esc(h.name)}</div>
    <table class="num"><thead><tr><th>Datum</th><th>Zeit</th><th>Tätigkeiten</th><th>Bestätigt</th></tr></thead><tbody>
      ${l.map((e) => `<tr><td>${datum(e.datum)}</td><td>${e.von}–${e.bis}</td><td>${e.taet.join(", ")}</td><td>${e.unterschrift ? `<img class="u" src="${e.unterschrift}" alt="Unterschrift">` : `${esc(e.wer)}<br>digital am ${datum(e.bestaetigtAm || e.datum)}`}</td></tr>`).join("")}</tbody></table>${fussH(h)}</section>`;
}
function eurHtml(hid) {
  const h = helfer(hid), r = eur(hid, JAHR);
  return `<section class="blatt"><div class="kopf"><div><h1>Einnahmenüberschussrechnung ${JAHR}</h1>Zeitraum 01.01.${JAHR} bis ${datum(HEUTE_ISO)}</div><div style="text-align:right">${esc(h.name)}<br>Steuernummer ${esc(h.stnr)}</div></div>
    ${eurTabelle(r)}<h2>Buchungen</h2>
    <table class="num"><thead><tr><th>Nr.</th><th>Datum</th><th>Beschreibung</th><th class="r">Betrag</th></tr></thead><tbody>
      ${[...r.kb].sort((a, b) => a.nr - b.nr).map((x) => `<tr><td>${x.nr}</td><td>${datum(x.datum)}</td><td>${esc(x.text)}<br><span style="color:#666">${x.typ === "ein" ? KAT_EIN[x.kat] : KAT_AUS[x.kat]}, ${x.zahlweg}</span></td><td class="r">${x.typ === "ein" ? "" : "−"}${euro(x.betrag)}</td></tr>`).join("")}</tbody></table>
    <div>Übersicht aus dem Kassenbuch der App. Die amtliche Anlage EÜR wird über ELSTER übermittelt; diese Aufstellung dient als Grundlage dafür und für die Steuerberatung.</div>${fussH(h)}</section>`;
}
function zeigeDruck(titel, html) {
  druck.innerHTML = `<div class="druck-bar"><div class="grow"><b>${titel}</b><br><span class="small muted">A4-Ansicht. In der fertigen App öffnet „Drucken“ den Druckdialog, dort auch „Als PDF sichern“.</span></div>
    <button class="btn" data-drucken type="button">Drucken</button><button class="btn ghost" data-druck-zu type="button">Schließen</button></div><div class="blatt-wrap">${html}</div>`;
  document.getElementById("druckbereich").innerHTML = html; druck.showModal();
}

// ================================================================ Ereignisse
function anfrage(art, text, kid, extra = {}) {
  const von = ui.rolle === "angehoerige" ? { von: klient(ui.a).angeh.name, rolle: "Angehörige", klient: ui.a } : ui.rolle === "klient" ? { von: klient(ui.k).name, rolle: "Klient", klient: ui.k } : { von: helfer(ui.h).name, rolle: "Begleiterin", klient: kid || null };
  db.anfragen.push({ id: "a" + Date.now(), art, text, am: HEUTE_ISO, status: "neu", ...von, ...extra });
}
function bestaetigt(e, wer, bild) { e.status = "bestaetigt"; e.wer = wer; e.unterschrift = bild || null; e.bestaetigtAm = HEUTE_ISO; speichern(); }
function hinweis(t) { const p = document.createElement("div"); p.className = "info"; p.textContent = t; p.setAttribute("role", "status"); main.querySelector(".view")?.prepend(p); setTimeout(() => p.remove(), 4000); }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, [data-einsatz]"); if (!t) return; const d = t.dataset;
  if ("zu" in d) dlg.close();
  else if ("druckZu" in d) druck.close();
  else if ("drucken" in d) window.print();
  else if (d.reiter) { const [f, w] = d.reiter.split(":"); ui[f] = w; route(); }
  else if (d.einsatz) einsatzDialog(d.einsatz);
  else if (d.termin) einsatzDialog(d.termin);
  else if (d.taet !== undefined || d.vermerk !== undefined) { if (!t.disabled) t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); }
  else if (d.unterschrift) { const e = einsatzLesen(); if (pruefen(e)) unterschriftDialog(e); }
  else if (d.digital) { const e = einsatzLesen(); if (!pruefen(e)) return; e.status = "wartet"; speichern(); delete dlg.dataset.einsatz; dlg.close(); route(); hinweis(`${klient(e.klient).angeh.name} wurde um Bestätigung gebeten.`); }
  else if (d.ausfall) { const e = einsatzLesen(); e.status = "abgesagt"; e.grund = e.protokoll || "Nicht angetroffen"; speichern(); delete dlg.dataset.einsatz; dlg.close(); route(); }
  else if ("sigNeu" in d) { const c = dlg.querySelector("#sig"); c.getContext("2d").clearRect(0, 0, c.width, c.height); c.dataset.leer = "1"; }
  else if (d.bestaetigen) { const e = db.einsaetze.find((x) => x.id === d.bestaetigen); const c = dlg.querySelector("#sig");
    if (c.dataset.leer === "1") { dlg.querySelector("#sig-fehler").hidden = false; return; } bestaetigt(e, klient(e.klient).name, c.toDataURL("image/png")); dlg.close(); route(); hinweis("Leistung bestätigt."); }
  else if (d.digitalOk) { const e = db.einsaetze.find((x) => x.id === d.digitalOk); bestaetigt(e, `${klient(e.klient).angeh.name} (digital)`); route(); hinweis("Danke, die Leistung ist bestätigt."); }
  else if (d.woche !== undefined) { ui.woche = d.woche === "0" ? montag(HEUTE_ISO) : plusTage(Number(d.woche), vonIso(ui.woche)); route(); }
  else if (d.neuSerie !== undefined) serieDialog(d.neuSerie || db.klienten[0].id);
  else if (d.serieEnde) { const s = db.serien.find((x) => x.id === d.serieEnde); if (!t.dataset.sicher) { t.dataset.sicher = "1"; t.textContent = "Sicher? Noch einmal tippen"; return; }
    s.bisDatum = HEUTE_ISO; db.einsaetze = db.einsaetze.filter((e) => !(e.serie === s.id && e.status === "geplant" && e.datum > HEUTE_ISO)); speichern(); route(); }
  else if (d.klientAkte) klientAkte(d.klientAkte);
  else if ("neuKlient" in d) klientNeuDialog();
  else if (d.anfrageOk) { db.anfragen.find((a) => a.id === d.anfrageOk).status = "erledigt"; speichern(); route(); }
  else if (d.rechnung) zeigeDruck("Rechnung und Leistungsnachweis", rechnungHtml(d.rechnung));
  else if (d.abrechnen) { db.abrechnung[d.abrechnen] = { status: "abgerechnet", nr: `${d.abrechnen.slice(0, 7).replace("-", "")}-${String(db.rn++).padStart(3, "0")}` }; speichern(); route(); }
  else if (d.bezahlt) { const a = db.abrechnung[d.bezahlt]; const [ym, hid, kid] = d.bezahlt.split("|");
    const summe = db.einsaetze.filter((e) => e.klient === kid && e.helfer === hid && e.status === "bestaetigt" && e.datum.startsWith(ym)).reduce((s, e) => s + betrag(e), 0);
    db.kassenbuch.push({ helfer: hid, nr: db.kassenbuch.filter((x) => x.helfer === hid).length + 1, datum: HEUTE_ISO, typ: "ein", betrag: Math.round(summe * 100) / 100, kat: "kasse", text: `Zahlung Rechnung ${a.nr} (${klient(kid).kasse})`, zahlweg: "Konto", ref: d.bezahlt, storno: false });
    a.status = "bezahlt"; speichern(); route(); }
  else if (d.buchung) buchungDialog(d.buchung);
  else if (d.kat) dlg.querySelectorAll("[data-kat]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (d.zahl) dlg.querySelectorAll("[data-zahl]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (d.wunschart) dlg.querySelectorAll("[data-wunschart]").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (d.storno) { const [hid, nr] = d.storno.split(":"); const x = db.kassenbuch.find((y) => y.helfer === hid && y.nr === Number(nr));
    if (!t.dataset.sicher) { t.dataset.sicher = "1"; t.textContent = "Sicher?"; return; } x.storno = true; speichern(); route(); }
  else if ("kbAlle" in d) { ui.kbAlle = !ui.kbAlle; route(); }
  else if ("eur" in d) zeigeDruck(`Einnahmenüberschussrechnung ${JAHR}`, eurHtml(ui.h));
  else if (d.wunsch) wunschDialog(d.wunsch);
  else if (d.anfrage) nachrichtDialog(d.anfrage);
  else if (d.absage) absageDialog(d.absage);
  else if ("abwesend" in d) nachrichtDialog("Abwesenheit");
});
dlg.addEventListener("close", () => { if (dlg.dataset.einsatz) { einsatzLesen(); delete dlg.dataset.einsatz; route(); } });
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "wahl-h") { ui.h = ev.target.value; ui.kbAlle = false; route(); }
  else if (id === "wahl-k") { ui.k = ev.target.value; route(); }
  else if (id === "wahl-a") { ui.a = ev.target.value; route(); }
  else if (id === "tour-h") { ui.tourH = ev.target.value; route(); }
  else if (id === "tour-tag") { ui.tourTag = ev.target.value || HEUTE_ISO; route(); }
  else if (id === "ab-monat") { ui.abMonat = ev.target.value; route(); }
  else if (id === "komm") { klient(ui.a).angeh.kommunikation = ev.target.checked; speichern(); route(); }
  else if (ev.target.closest("#serie-form")) serieVorschau();
});
document.addEventListener("input", (ev) => { if (ev.target.closest("#serie-form")) serieVorschau(); });
document.addEventListener("submit", async (ev) => {
  ev.preventDefault(); const f = ev.target; const v = (id) => f.querySelector("#" + id).value.trim();
  if (f.id === "serie-form") {
    const s = { id: "s" + Date.now(), klient: v("s-klient"), helfer: v("s-helfer"), tag: Number(v("s-tag")), von: v("s-von"), bis: v("s-bis"), alle: Number(v("s-alle")), ab: v("s-ab") || plusTage(1), taet: [] };
    if (minuten(s.von, s.bis) <= 0) return;
    const erst = vonIso(s.ab); while (erst.getDay() !== s.tag) erst.setDate(erst.getDate() + 1);
    const k = konflikt(s.helfer, iso(erst), s.von, s.bis);
    if (k && !f.dataset.trotzdem) { const p = f.querySelector("#s-fehler"); p.textContent = `${helfer(s.helfer).name} hat am ${tagKurz(iso(erst))} schon ${k.von}–${k.bis} bei ${klient(k.klient).name}. Noch einmal „Anlegen“ tippen, um trotzdem zu speichern.`; p.hidden = false; f.dataset.trotzdem = "1"; return; }
    db.serien.push(s); erzeugeTermine(db, s, s.ab, plusTage(42)); speichern(); dlg.close(); route(); hinweis(`Fester Termin angelegt: ${WOCHENTAGE[s.tag]}s ${s.von} Uhr bei ${klient(s.klient).name}.`); return;
  }
  if (f.id === "wunsch-form") { const art = f.querySelector("[data-wunschart][aria-pressed=true]").dataset.wunschart; anfrage("Terminwunsch", `${art}: ${tagKurz(v("w-datum"))}, ${v("w-zeit")} Uhr. ${v("w-text")}`.trim(), f.dataset.klient); speichern(); dlg.close(); route(); hinweis("Ihre Anfrage ist im Büro angekommen."); return; }
  if (f.id === "nachricht-form") { anfrage(f.dataset.art, f.querySelector("#m-text").value.trim() || "Bitte um Rückruf."); speichern(); dlg.close(); route(); hinweis("Ihre Nachricht ist im Büro angekommen."); return; }
  if (f.id === "absage-form") { const e = db.einsaetze.find((x) => x.id === f.dataset.einsatz);
    anfrage("Absage", `${tagKurz(e.datum)} ${e.von} Uhr${v("ab-grund") ? ": " + v("ab-grund") : ""}`, e.klient, { einsatz: e.id }); e.status = "abgesagt"; e.grund = v("ab-grund") || "abgesagt"; speichern(); dlg.close(); route(); hinweis("Der Termin ist abgesagt. Das Büro und die Begleiterin wissen Bescheid."); return; }
  if (f.id === "klient-form") {
    db.klienten.push({ id: "k" + Date.now(), name: v("k-name"), anrede: v("k-anrede") || v("k-name"), anschrift: v("k-anschrift"), x: Math.random() * 3, y: Math.random() * 2, tel: v("k-tel"), geb: "1940-01-01", pg: Number(v("k-pg")), kasse: v("k-kasse"), vnr: "", abtretung: HEUTE_ISO, vorjahr: 0, pflegegeld: true, beratung: HEUTE_ISO, notiz: "", seit: HEUTE_ISO,
      angeh: v("k-aname") ? { name: v("k-aname"), rolle: "Angehörige", ort: "", tel: v("k-atel"), mail: "", zugang: f.querySelector("#k-azugang").checked, kommunikation: false, vollmacht: false, freigabe: HEUTE_ISO } : null });
    speichern(); dlg.close(); route(); return; }
  if (f.id === "buchung-form") { let beleg = null; const datei = f.querySelector("#bu-beleg").files[0]; if (datei) beleg = await verkleinern(datei);
    db.kassenbuch.push({ helfer: ui.h, nr: db.kassenbuch.filter((x) => x.helfer === ui.h).length + 1, datum: v("bu-datum"), typ: f.dataset.typ, betrag: Math.round(Number(v("bu-betrag")) * 100) / 100,
      kat: f.querySelector("[data-kat][aria-pressed=true]").dataset.kat, text: v("bu-text"), zahlweg: f.querySelector("[data-zahl][aria-pressed=true]").dataset.zahl, storno: false, beleg });
    speichern(); dlg.close(); route(); }
});
function verkleinern(datei) {
  return new Promise((ok) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 600 / img.width); const c = document.createElement("canvas");
    c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .7)); };
    img.onerror = () => ok(null); img.src = URL.createObjectURL(datei); });
}
route();
</script>
